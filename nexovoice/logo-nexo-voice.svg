<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-labelledby="title desc">
  <title id="title">Nexo Voice</title>
  <desc id="desc">Logo oficial Nexo Voice en blanco, azul y violeta con onda de voz integrada.</desc>
  <defs>
    <linearGradient id="voiceGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6f63ff"/>
      <stop offset="0.52" stop-color="#8f57ef"/>
      <stop offset="1" stop-color="#7dc8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(10 18)">
    <text x="0" y="100" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="900" letter-spacing="-5">NEXO</text>
    <text x="302" y="100" fill="url(#voiceGradient)" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="900" letter-spacing="-6">VOICE</text>
    <g transform="translate(377 67)" stroke="#3dbdff" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
      <path d="M0 18V2M10 24V-4M20 15V5M30 28V-8M40 20V0M50 12V8M60 24V-4M70 18V2"/>
    </g>
  </g>
</svg>