<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Nexo Voice · Rafa voces</title><link rel="icon" href="/app-icon.svg?v=5" type="image/svg+xml"><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--gold:#d6ab5c;--green:#79e6a2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#090909,#030303 60%,#111);color:#fff;padding:20px}.wrap{max-width:800px;margin:18px auto}.top img{width:185px}.card{margin-top:18px;background:#0c0c0def;border:1px solid #d6ab5c44;border-radius:26px;padding:28px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(30px,7vw,48px);margin:10px 0}.sub{color:#aaa;line-height:1.55}.status{margin:18px 0;padding:14px 16px;border-radius:14px;background:#ffffff09}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.test{padding:18px;border:1px solid #d6ab5c55;border-radius:18px;background:#d6ab5c0c;transition:.2s}.test b{display:block;font-size:20px}.test small{display:block;color:#999;margin:6px 0 12px;line-height:1.4;min-height:40px}.test button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer;background:#f0d58e;color:#111}.test.active{border-color:#5ad58b;background:#5ad58b14;box-shadow:0 0 0 1px #5ad58b55}.test.active button{background:var(--green)}.error{display:none;background:#ef444422;color:#ffcaca;padding:12px;border-radius:12px;margin-top:12px}audio{width:100%;margin-top:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:21px}}</style></head><body><div class="wrap"><div class="top"><a href="/"><img src="/logo-nexo-voice.svg" alt="Nexo Voice"></a></div><main class="card"><div class="eyebrow">Laboratorio aislado · no producción</div><h1>Rafa: elegir voz</h1><p class="sub">Prueba cuatro voces masculinas de ElevenLabs con el mismo texto. Esta página no modifica a Carla ni cambia todavía la voz pública de Rafa.</p><div id="status" class="status">Buscando voces masculinas en ElevenLabs…</div><div class="grid" id="grid"></div><div id="error" class="error"></div><audio id="player" controls></audio></main></div><script>
const statusEl=document.getElementById('status'),errorEl=document.getElementById('error'),player=document.getElementById('player'),grid=document.getElementById('grid');let choices=[],active=null;
const text='Hola, soy Rafa, el asistente virtual de Nexo Voice. Encantado de atenderte. Cuéntame con tranquilidad qué necesitas y buscaré la mejor manera de ayudarte. Puedo gestionar una cita o una reserva, resolver tus dudas, tomar nota de un mensaje o indicarte con quién necesitas hablar. Por ejemplo, si llamas porque quieres cambiar una cita que ya tenías prevista para mañana, dime a qué hora la tenías y qué horario te vendría mejor. Si se trata de otra consulta, no hay problema: explícamela y seguimos desde ahí. Mi objetivo es que la conversación sea sencilla, rápida y natural, como si estuvieras hablando con una persona del propio negocio.';
const preferred=['mauricio','leoni vergara','nathaniel c.','mark'];
const norm=s=>String(s||'').trim().toLowerCase();
function male(v){const l=v.labels||{};return norm(l.gender)==='male'||norm(l.gender)==='masculino'}
function conversational(v){const s=norm([v.name,v.description,v.labels?.description,v.labels?.use_case].filter(Boolean).join(' '));return /convers|assistant|asistente|customer|care|friendly|calm|casual|virtual/.test(s)}
function rank(v){const n=norm(v.name);let x=0;const p=preferred.indexOf(n);if(p>=0)x+=1000-p*100;if(conversational(v))x+=100;if(norm(v.labels?.language)==='es')x+=40;if(v.featured)x+=20;x+=Math.min(Number(v.trending_score||0)/1000000,20);return x}
function render(){grid.innerHTML=choices.map((v,i)=>'<div class="test" data-card="'+i+'"><b>Rafa '+String.fromCharCode(65+i)+'</b><small>'+escapeHtml(v.name)+' · '+escapeHtml(v.labels?.accent||v.labels?.use_case||v.description||'Voz masculina')+'</small><button data-test="'+i+'">▶ Escuchar '+String.fromCharCode(65+i)+'</button></div>').join('');document.querySelectorAll('button[data-test]').forEach(b=>b.onclick=()=>play(Number(b.dataset.test)))}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function mark(i,state='playing'){active=i;document.querySelectorAll('.test').forEach(c=>c.classList.toggle('active',Number(c.dataset.card)===i));document.querySelectorAll('button[data-test]').forEach(b=>{const k=Number(b.dataset.test),letter=String.fromCharCode(65+k);b.textContent=k===i?(state==='loading'?'⏳ Generando '+letter:'🔊 Reproduciendo '+letter):'▶ Escuchar '+letter})}
async function load(){try{const r=await fetch('/api/elevenlabs-voices',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error('No se pudo consultar ElevenLabs.');const all=(d.voices||[]).filter(male).sort((a,b)=>rank(b)-rank(a));const picked=[];for(const name of preferred){const v=all.find(x=>norm(x.name)===name&&!picked.some(p=>p.voice_id===x.voice_id));if(v)picked.push(v)}for(const v of all){if(picked.length>=4)break;if(conversational(v)&&!picked.some(p=>p.voice_id===v.voice_id))picked.push(v)}for(const v of all){if(picked.length>=4)break;if(!picked.some(p=>p.voice_id===v.voice_id))picked.push(v)}choices=picked.slice(0,4);if(choices.length<2)throw new Error('No hay suficientes voces masculinas disponibles en la cuenta para comparar.');render();statusEl.textContent='Listo. Escucha A, B, C y D con el mismo texto y dime cuál te gusta más para Rafa.'}catch(e){statusEl.textContent=e.message}}
async function play(i){const v=choices[i];if(!v)return;player.pause();errorEl.style.display='none';mark(i,'loading');const letter=String.fromCharCode(65+i);statusEl.textContent='Generando Rafa '+letter+'…';try{const r=await fetch('/api/elevenlabs-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_id:v.voice_id,text,model_id:'eleven_multilingual_v2',speed:1.02,stability:.72,similarity_boost:.9,style:.08,stable:1})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||d.error||'No se pudo generar la prueba')}const blob=await r.blob();if(player.src)URL.revokeObjectURL(player.src);player.src=URL.createObjectURL(blob);mark(i);await player.play();statusEl.textContent='Escuchando Rafa '+letter+'. Esa es la opción marcada en verde.'}catch(e){errorEl.style.display='block';errorEl.textContent=e.message;statusEl.textContent='Prueba no disponible'}}
player.addEventListener('ended',()=>{if(active!==null){const b=document.querySelector('button[data-test="'+active+'"]');if(b)b.textContent='▶ Escuchar '+String.fromCharCode(65+active)}});load();
</script></body></html>
