<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Nexo Voice · Rafa voces exactas</title><link rel="icon" href="/app-icon.svg?v=5" type="image/svg+xml"><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--gold:#d6ab5c;--green:#79e6a2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#090909,#030303 60%,#111);color:#fff;padding:20px}.wrap{max-width:800px;margin:18px auto}.top img{width:185px}.card{margin-top:18px;background:#0c0c0def;border:1px solid #d6ab5c44;border-radius:26px;padding:28px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(30px,7vw,48px);margin:10px 0}.sub{color:#aaa;line-height:1.55}.status{margin:18px 0;padding:14px 16px;border-radius:14px;background:#ffffff09}.grid{display:grid;grid-template-columns:1fr;gap:12px}.test{padding:18px;border:1px solid #d6ab5c55;border-radius:18px;background:#d6ab5c0c}.test b{display:block;font-size:20px}.test small{display:block;color:#999;margin:6px 0 12px;line-height:1.4}.test button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer;background:#f0d58e;color:#111}.test button:disabled{opacity:.45;cursor:not-allowed}.test.active{border-color:#5ad58b;background:#5ad58b14}.test.active button{background:var(--green)}.missing{border-color:#ef444455}.missing small{color:#ffb4b4}.error{display:none;background:#ef444422;color:#ffcaca;padding:12px;border-radius:12px;margin-top:12px}audio{width:100%;margin-top:16px}@media(max-width:650px){.card{padding:21px}}</style></head><body><div class="wrap"><div class="top"><a href="/"><img src="/logo-nexo-voice.svg" alt="Nexo Voice"></a></div><main class="card"><div class="eyebrow">Laboratorio aislado · Rafa</div><h1>Rafa: tres voces exactas</h1><p class="sub">Solo se prueban Alberto Rodríguez, David Martin y Leoni Vergara. Si una voz no está disponible en nuestra biblioteca, se indicará como no disponible y no será sustituida por otra. Carla no se modifica.</p><div id="status" class="status">Buscando exactamente las tres voces…</div><div class="grid" id="grid"></div><div id="error" class="error"></div><audio id="player" controls></audio></main></div><script>
const statusEl=document.getElementById('status'),errorEl=document.getElementById('error'),player=document.getElementById('player'),grid=document.getElementById('grid');let choices=[],active=null;
const text='Hola, soy Rafa, el asistente virtual de Nexo Voice. Estoy aquí para ayudarte. Puedo gestionar una cita, resolver tus dudas, tomar nota de un mensaje o indicarte con quién necesitas hablar. Cuéntame qué necesitas y seguimos desde ahí.';
const requested=[{label:'Alberto Rodríguez',aliases:['alberto rodriguez','alberto rodríguez']},{label:'David Martin',aliases:['david martin','david martín']},{label:'Leoni Vergara',aliases:['leoni vergara']}];
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(){grid.innerHTML=choices.map((x,i)=>x.voice?'<div class="test" data-card="'+i+'"><b>Rafa '+String.fromCharCode(65+i)+' · '+esc(x.label)+'</b><small>'+esc(x.voice.labels?.accent||x.voice.labels?.use_case||x.voice.description||'Voz disponible en ElevenLabs')+'</small><button data-test="'+i+'">▶ Escuchar '+esc(x.label)+'</button></div>':'<div class="test missing" data-card="'+i+'"><b>'+esc(x.label)+'</b><small>No disponible en la biblioteca que devuelve nuestra cuenta de ElevenLabs. No se ha sustituido por ninguna otra voz.</small><button disabled>No disponible</button></div>').join('');document.querySelectorAll('button[data-test]').forEach(b=>b.onclick=()=>play(+b.dataset.test))}
function mark(i,state='playing'){active=i;document.querySelectorAll('.test').forEach(c=>c.classList.toggle('active',+c.dataset.card===i));document.querySelectorAll('button[data-test]').forEach(b=>{const k=+b.dataset.test,x=choices[k];if(!x?.voice)return;b.textContent=k===i?(state==='loading'?'⏳ Generando '+x.label:'🔊 Reproduciendo '+x.label):'▶ Escuchar '+x.label})}
async function load(){try{const r=await fetch('/api/elevenlabs-voices',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error('No se pudo consultar ElevenLabs.');const all=d.voices||[];choices=requested.map(req=>({label:req.label,voice:all.find(v=>req.aliases.map(norm).includes(norm(v.name)))||null}));render();const available=choices.filter(x=>x.voice).length;statusEl.textContent=available===3?'Perfecto: están disponibles las tres voces exactas.':'Disponibles '+available+' de 3 voces exactas. Las que falten no serán sustituidas.'}catch(e){statusEl.textContent=e.message}}
async function play(i){const x=choices[i];if(!x?.voice)return;player.pause();errorEl.style.display='none';mark(i,'loading');statusEl.textContent='Generando '+x.label+'…';try{const r=await fetch('/api/elevenlabs-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_id:x.voice.voice_id,text,model_id:'eleven_multilingual_v2',speed:1.02,stability:.68,similarity_boost:.92,style:.1,stable:1})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.detail||d.error||'No se pudo generar la prueba')}const blob=await r.blob();if(player.src)URL.revokeObjectURL(player.src);player.src=URL.createObjectURL(blob);mark(i);await player.play();statusEl.textContent='Escuchando '+x.label+'.'}catch(e){errorEl.style.display='block';errorEl.textContent=e.message;statusEl.textContent='Prueba no disponible'}}player.addEventListener('ended',()=>{if(active!==null){const b=document.querySelector('button[data-test="'+active+'"]');if(b&&choices[active])b.textContent='▶ Escuchar '+choices[active].label}});load();
</script></body></html>
