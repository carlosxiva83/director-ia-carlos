<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Nexo Voice · Oportunidades comerciales</title><link rel="icon" href="/app-icon.svg?v=4" type="image/svg+xml"><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--gold:#d6ab5c;--muted:#9ea3ad;--line:#ffffff17;--green:#43d69e;--blue:#6db6ff;--amber:#ffc768}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#2b2112,#090909 35%,#030303);color:#fff}.shell{width:min(1180px,calc(100% - 30px));margin:auto;padding:22px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.top img{width:210px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bell{position:relative;border:1px solid var(--line);background:#ffffff0b;color:#fff;border-radius:999px;padding:10px 15px;font-weight:900}.bell b{position:absolute;right:-5px;top:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:#e34d5b;display:grid;place-items:center;font-size:11px}.btn{border:1px solid var(--line);background:#ffffff0b;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.hero{margin-top:24px;padding:24px;border:1px solid #d6ab5c42;border-radius:24px;background:linear-gradient(135deg,#171109,#090909)}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,45px)}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:16px 0}.stat,.panel,.card,.loginCard{border:1px solid var(--line);border-radius:18px;background:#0d0d0ee8}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase}.stat strong{font-size:28px;display:block;margin-top:7px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:13px;flex-wrap:wrap}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:#ffffff08;color:#bbb;padding:7px 10px;border-radius:999px;font-weight:800;cursor:pointer}.filters button.active{background:#fff;color:#090909}.panel{padding:18px}.list{display:grid;gap:10px}.card{padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px;cursor:pointer}.card.newLead{border-color:#d6ab5c68;box-shadow:0 0 0 1px #d6ab5c1a inset}.card h3{margin:0 0 5px;font-size:16px}.meta{color:var(--muted);font-size:12px}.need{margin-top:9px;color:#e8e8ea;line-height:1.45}.right{text-align:right}.tag{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;margin-top:7px}.new{color:var(--amber);background:#ffc76817}.contacted{color:var(--blue);background:#6db6ff17}.proposal_sent{color:#d7b5ff;background:#a967ff17}.won{color:var(--green);background:#43d69e17}.lost{color:#aaa;background:#ffffff12}.detail{display:none;margin-top:14px}.detail.open{display:block}.detailGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.field{padding:12px;border-radius:13px;background:#ffffff08}.field span{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;margin-bottom:5px}.summary{margin-top:10px;padding:14px;border-radius:14px;background:#d6ab5c0d;border:1px solid #d6ab5c28;line-height:1.5}.statusBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.statusBtns button{flex:1;min-width:130px}.empty{padding:35px;text-align:center;color:var(--muted)}.login{position:fixed;inset:0;background:#020202f5;display:grid;place-items:center;padding:20px;z-index:20}.login.hidden{display:none}.loginCard{width:min(430px,100%);padding:27px}.loginCard img{width:190px;display:block;margin:0 auto 18px}.loginCard h2{margin:0 0 7px}.loginCard p{color:var(--muted)}label{display:block;font-size:12px;font-weight:900;margin:13px 0 6px}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#080808;color:#fff;font-size:15px}.loginCard button{width:100%;margin-top:17px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#f0d58e,#ba8538);color:#080808;font-weight:900}.err{display:none;margin-top:12px;padding:11px;border-radius:11px;background:#e34d5b1c;color:#ffc9ce}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.detailGrid{grid-template-columns:1fr}.card{grid-template-columns:1fr}.right{text-align:left}}</style></head><body><div id="login" class="login"><form id="loginForm" class="loginCard"><img src="/logo-nexo-voice.svg" alt="Nexo Voice"><h2>Panel comercial</h2><p>Oportunidades generadas por personas que prueban Nexo Voice.</p><label>Usuario</label><input id="username" autocomplete="username" required><label>Código de acceso</label><input id="code" type="password" autocomplete="current-password" required><button>Entrar</button><div id="loginErr" class="err"></div></form></div><main class="shell"><div class="top"><img src="/logo-nexo-voice.svg" alt="Nexo Voice"><div class="actions"><div class="bell">🔔 Nuevos contactos <b id="bellCount">0</b></div><button id="refresh" class="btn">Actualizar</button><button id="logout" class="btn">Salir</button></div></div><section class="hero"><h1>Oportunidades comerciales</h1><p>Contactos que Nexo Voice ha detectado, cualificado y preparado para seguimiento.</p></section><section class="stats"><div class="stat"><span>Nuevos</span><strong id="sNew">0</strong></div><div class="stat"><span>Contactados</span><strong id="sContacted">0</strong></div><div class="stat"><span>Propuestas</span><strong id="sProposal">0</strong></div><div class="stat"><span>Clientes</span><strong id="sWon">0</strong></div></section><section class="panel"><div class="toolbar"><strong>Contactos</strong><div class="filters"><button class="active" data-filter="all">Todos</button><button data-filter="new">Nuevos</button><button data-filter="contacted">Contactados</button><button data-filter="proposal_sent">Propuesta</button><button data-filter="won">Cliente</button></div></div><div id="list" class="list"></div></section><section id="detail" class="detail"><div id="detailBody" class="panel"></div></section></main><script>const API='https://jrsknjeuwwyucefcsckq.supabase.co/functions/v1/nexo-commercial-panel';let token=localStorage.getItem('nexo_commercial_token')||'',rows=[],filter='all',activeId=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const statusLabel=s=>s==='new'?'Nuevo':s==='contacted'?'Contactado':s==='proposal_sent'?'Propuesta enviada':s==='won'?'Cliente':'Cerrado';const fmt=t=>new Date(t).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});async function api(method='GET',body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d}function render(){const n=rows.filter(x=>x.status==='new').length;$('bellCount').textContent=n;$('sNew').textContent=n;$('sContacted').textContent=rows.filter(x=>x.status==='contacted').length;$('sProposal').textContent=rows.filter(x=>x.status==='proposal_sent').length;$('sWon').textContent=rows.filter(x=>x.status==='won').length;const data=filter==='all'?rows:rows.filter(x=>x.status===filter);$('list').innerHTML=data.length?data.map(x=>`<article class="card ${x.status==='new'?'newLead':''}" data-id="${x.id}"><div><h3>${esc(x.company||x.contact_name||'Contacto interesado')}</h3><div class="meta">${esc(x.contact_name||'Sin nombre')} · ${esc(x.sector||'Sector no indicado')} · ${fmt(x.created_at)}</div><div class="need">${esc(x.needs)}</div></div><div class="right"><div>${esc(x.phone||x.email||'')}</div><span class="tag ${x.status}">${statusLabel(x.status)}</span></div></article>`).join(''):'<div class="empty">No hay contactos en esta vista.</div>';$('list').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>showDetail(el.dataset.id));if(activeId)showDetail(activeId,false)}function showDetail(id,scroll=true){activeId=id;const x=rows.find(r=>r.id===id);if(!x)return;$('detail').classList.add('open');$('detailBody').innerHTML=`<h2>${esc(x.company||'Oportunidad comercial')}</h2><div class="detailGrid"><div class="field"><span>Contacto</span>${esc(x.contact_name||'—')}</div><div class="field"><span>Empresa</span>${esc(x.company||'—')}</div><div class="field"><span>Teléfono</span>${x.phone?`<a href="tel:${esc(x.phone)}" style="color:#f1d58d">${esc(x.phone)}</a>`:'—'}</div><div class="field"><span>Email</span>${x.email?`<a href="mailto:${esc(x.email)}" style="color:#f1d58d">${esc(x.email)}</a>`:'—'}</div><div class="field"><span>Sector</span>${esc(x.sector||'—')}</div><div class="field"><span>Interés</span>${esc(x.interest_level||'warm')}</div></div><div class="summary"><strong>Qué necesita</strong><br>${esc(x.needs)}${x.interested_features?`<br><br><strong>Funciones que le interesan</strong><br>${esc(x.interested_features)}`:''}${x.conversation_summary?`<br><br><strong>Resumen</strong><br>${esc(x.conversation_summary)}`:''}</div><div class="statusBtns"><button class="btn" data-st="new">Nuevo</button><button class="btn" data-st="contacted">Contactado</button><button class="btn" data-st="proposal_sent">Propuesta enviada</button><button class="btn" data-st="won">Cliente</button><button class="btn" data-st="lost">Cerrado</button></div>`;$('detailBody').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>setStatus(id,b.dataset.st));if(scroll)$('detail').scrollIntoView({behavior:'smooth',block:'start'})}async function setStatus(id,status){await api('PATCH',{id,status});const x=rows.find(r=>r.id===id);if(x)x.status=status;render()}async function load(){try{const d=await api();rows=d.leads||[];$('login').classList.add('hidden');render()}catch(e){if(String(e.message).includes('unauthorized')){$('login').classList.remove('hidden');localStorage.removeItem('nexo_commercial_token');token=''}else alert(e.message)}}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginErr').style.display='none';try{const d=await api('POST',{action:'login',username:$('username').value.trim(),code:$('code').value});token=d.token;localStorage.setItem('nexo_commercial_token',token);await load()}catch(err){$('loginErr').textContent='Usuario o código incorrecto';$('loginErr').style.display='block'}};$('refresh').onclick=load;$('logout').onclick=()=>{token='';localStorage.removeItem('nexo_commercial_token');$('login').classList.remove('hidden')};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});if(token)load();</script></body></html>
