<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Voice · Comparador A/B/C</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e293b,#0f172a 48%,#020617);color:white;padding:22px}.wrap{max-width:720px;margin:auto}.brand{letter-spacing:.14em;opacity:.7;font-weight:800}.card{background:rgba(15,23,42,.88);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:24px;margin-top:18px}.versions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.v{padding:18px 10px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-size:18px;font-weight:800}.v.active{background:#fff;color:#0f172a}.main{width:100%;padding:17px;border:0;border-radius:18px;font-size:17px;font-weight:800}.stop{margin-top:10px;background:rgba(255,255,255,.07);color:white;border:1px solid rgba(255,255,255,.12)}.status{padding:14px;border-radius:16px;background:rgba(255,255,255,.06);margin:16px 0}.hint{opacity:.65;line-height:1.5;font-size:14px}.err{display:none;margin-top:12px;padding:12px;background:rgba(239,68,68,.12);border-radius:12px}@media(max-width:520px){.card{padding:20px}}</style></head><body><main class="wrap"><div class="brand">NEXO VOICE · LAB</div><section class="card"><h1>Comparador de naturalidad</h1><p class="hint">Habla de lo mismo con A, B y C. Finaliza una versión antes de cambiar a otra.</p><div class="versions"><button class="v active" data-v="A">A</button><button class="v" data-v="B">B</button><button class="v" data-v="C">C</button></div><div class="status" id="status">Versión A · lista</div><button class="main" id="start">🎙️ Empezar versión A</button><button class="main stop" id="stop" disabled>Finalizar prueba</button><div class="err" id="err"></div><audio id="remote" autoplay style="display:none"></audio><p class="hint">A = cercana equilibrada · B = conversación más espontánea · C = mismo comportamiento humano con otra voz.</p></section></main><script>
let selected='A',pc,dc,stream;const status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop'),err=document.getElementById('err'),remote=document.getElementById('remote');
const base=`Habla siempre en español de España. Eres una persona real atendiendo el teléfono de una empresa, nunca una centralita. Sé cercana, humana, simpática y resolutiva. Escucha antes de responder. Una sola pregunta cada vez. Nada de lenguaje burocrático, listas, interrogatorios ni frases de asistente. Adapta tu formalidad a la persona. No inventes acciones realizadas. La marca Aurenexo se pronuncia “Aura Nexo”.`;
const cfg={A:{voice:'marin',style:`${base} Habla con naturalidad cálida y profesional. Usa frases cortas y conectores cotidianos solo cuando encajen: vale, claro, dime, cuéntame. No abuses de muletillas.`},B:{voice:'marin',style:`${base} Prioriza espontaneidad de conversación real. No construyas respuestas demasiado perfectas. Reacciona primero de forma breve a lo que acaba de decir la persona y después continúa. Varía la longitud y el comienzo de las frases. Puedes usar pequeñas expresiones naturales como “ah, vale”, “sí, claro”, “a ver”, “entiendo” o “cuéntame”, pero nunca de forma repetitiva. Evita sonar como texto escrito leído en voz alta.`},C:{voice:'cedar',style:`${base} Habla de forma relajada, fluida y muy conversacional, como alguien con experiencia atendiendo clientes todos los días. Responde directamente al contenido concreto que te dicen antes de preguntar lo siguiente. Evita cualquier frase que parezca preparada o corporativa.`}};
function setUI(){document.querySelectorAll('.v').forEach(b=>b.classList.toggle('active',b.dataset.v===selected));start.textContent='🎙️ Empezar versión '+selected;status.textContent='Versión '+selected+' · lista'}
document.querySelectorAll('.v').forEach(b=>b.onclick=()=>{if(pc)return;selected=b.dataset.v;setUI()});
function cleanup(){try{dc?.close()}catch{}try{pc?.close()}catch{}stream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{}pc=dc=stream=null;start.disabled=false;stop.disabled=true;setUI()}
start.onclick=async()=>{start.disabled=true;err.style.display='none';status.textContent='Versión '+selected+' · conectando…';try{stream=await navigator.mediaDevices.getUserMedia({audio:true});pc=new RTCPeerConnection();pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};stream.getTracks().forEach(t=>pc.addTrack(t,stream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{status.textContent='Versión '+selected+' · escuchando';stop.disabled=false;const c=cfg[selected];dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:c.style,audio:{output:{voice:c.voice}}}}));setTimeout(()=>dc?.readyState==='open'&&dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:`Saluda muy brevemente como si acabaras de coger el teléfono. Di: 'Hola, soy Nexo Voice, de Aura Nexo. Cuéntame, ¿en qué te puedo ayudar?' Después conversa con el estilo configurado.`}})),150)};dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='error'){err.style.display='block';err.textContent=JSON.stringify(x.error||x)}}catch{}};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))cleanup()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});const body=await r.text();if(!r.ok)throw new Error(body);await pc.setRemoteDescription({type:'answer',sdp:body})}catch(e){cleanup();err.style.display='block';err.textContent=e.message||String(e)}};stop.onclick=cleanup;window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);setUI();
</script></body></html>
