<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Nexo Voice · C4.1</title><meta name="description" content="Prueba comparativa de Nexo Voice."><meta property="og:type" content="website"><meta property="og:site_name" content="Nexo Voice"><meta property="og:title" content="Nexo Voice · Prueba"><meta property="og:description" content="Prueba comparativa de Nexo Voice."><meta property="og:url" content="https://nexovoice.es/compare.html"><meta property="og:image" content="https://nexovoice.es/social-preview.png?v=4"><meta property="og:image:secure_url" content="https://nexovoice.es/social-preview.png?v=4"><meta property="og:image:type" content="image/png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://nexovoice.es/social-preview.png?v=4"><link rel="icon" href="/app-icon.svg?v=4" type="image/svg+xml"><link rel="apple-touch-icon" href="/app-icon.svg?v=4"><link rel="manifest" href="/manifest.json?v=4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nexo Voice"><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e293b,#0f172a 48%,#020617);color:white;padding:22px}.wrap{max-width:720px;margin:auto}.brand{letter-spacing:.14em;opacity:.7;font-weight:800}.card{background:rgba(15,23,42,.88);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:24px;margin-top:18px}.main{width:100%;padding:17px;border:0;border-radius:18px;font-size:17px;font-weight:800}.stop{margin-top:10px;background:rgba(255,255,255,.07);color:white;border:1px solid rgba(255,255,255,.12)}.status{padding:14px;border-radius:16px;background:rgba(255,255,255,.06);margin:16px 0}.hint{opacity:.65;line-height:1.5;font-size:14px}.err{display:none;margin-top:12px;padding:12px;background:rgba(239,68,68,.12);border-radius:12px}</style></head><body><main class="wrap"><div class="brand">NEXO VOICE · C4.1</div><section class="card"><h1>C4.1 · conversación con memoria</h1><p class="hint">Mantiene Cedar y el comportamiento ganador de C4. Ahora recuerda mejor lo ya dicho y evita respuestas típicas de asistente.</p><div class="status" id="status">C4.1 · lista</div><button class="main" id="start">🎙️ Empezar C4.1</button><button class="main stop" id="stop" disabled>Finalizar prueba</button><div class="err" id="err"></div><audio id="remote" autoplay style="display:none"></audio></section></main><script>
let pc,dc,stream;const status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop'),err=document.getElementById('err'),remote=document.getElementById('remote');
const STYLE=`Habla siempre en español de España. Usa la voz Cedar. Atiendes el teléfono como una persona real de la empresa, no como una centralita. Sé cercana, tranquila, resolutiva y profesional. Escucha el significado y responde a eso, no a una plantilla. Tu prioridad es una conversación humana, no demostrar amabilidad en cada frase. Recuerda activamente todos los datos que la persona ya haya dado durante esta conversación: nombre, teléfono, empresa, motivo, máquina, modelo, localidad, urgencia o cualquier otro detalle. Nunca vuelvas a pedir un dato ya proporcionado, aunque lo haya dicho antes de que tú lo preguntaras o mezclado con otra información. Si da varios datos de golpe, intégralos todos y continúa únicamente con lo que falte. No repitas ni resumas lo que acaba de decir salvo que exista una duda real que necesite confirmación. No respondas automáticamente “perfecto”, “vale”, “claro”, “entiendo” o “de acuerdo” después de cada dato; muchas veces continúa directamente. No anuncies procesos: nunca digas “voy a tomar unos datos”, “quiero pedirte unos datos”, “para poder ayudarte necesito”, “he registrado” o similares. Si necesitas datos básicos compatibles, pídelos juntos de forma natural: “Dime tu nombre y un teléfono de contacto”. Si ya conoces uno, pide solo el que falta. Los detalles que requieren explicación se obtienen después conversando. No hagas interrogatorios ni sigas un formulario rígido. Si la persona responde con información desordenada, aprovéchala sin corregir el orden. Alterna respuestas muy breves con otras algo más completas solo cuando haga falta. No cierres cada intervención con una fórmula amable. No conviertas cada turno en respuesta+explicación+pregunta. Usa lenguaje oral y variado. No inventes acciones realizadas. Aurenexo se pronuncia “Aura Nexo”.`;
function cleanup(){try{dc?.close()}catch{}try{pc?.close()}catch{}stream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{}pc=dc=stream=null;start.disabled=false;stop.disabled=true;status.textContent='C4.1 · lista'}
start.onclick=async()=>{start.disabled=true;err.style.display='none';status.textContent='C4.1 · conectando…';try{stream=await navigator.mediaDevices.getUserMedia({audio:true});pc=new RTCPeerConnection();pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};stream.getTracks().forEach(t=>pc.addTrack(t,stream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{status.textContent='C4.1 · escuchando';stop.disabled=false;dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:STYLE,audio:{output:{voice:'cedar'}}}}));setTimeout(()=>dc?.readyState==='open'&&dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:"Acabas de coger el teléfono. Saluda breve y natural: 'Hola, soy Nexo Voice, de Aura Nexo. Dime, ¿en qué te puedo ayudar?'. Después conversa siguiendo C4.1."}})),150)};dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='error'){err.style.display='block';err.textContent=JSON.stringify(x.error||x)}}catch{}};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))cleanup()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});const body=await r.text();if(!r.ok)throw new Error(body);await pc.setRemoteDescription({type:'answer',sdp:body})}catch(e){cleanup();err.style.display='block';err.textContent=e.message||String(e)}};stop.onclick=cleanup;window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);
</script></body></html>
