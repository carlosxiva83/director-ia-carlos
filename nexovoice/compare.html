<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Voice · C Lab</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e293b,#0f172a 48%,#020617);color:white;padding:22px}.wrap{max-width:720px;margin:auto}.brand{letter-spacing:.14em;opacity:.7;font-weight:800}.card{background:rgba(15,23,42,.88);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:24px;margin-top:18px}.versions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.v{padding:18px 8px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-size:18px;font-weight:800}.v.active{background:#fff;color:#0f172a}.main{width:100%;padding:17px;border:0;border-radius:18px;font-size:17px;font-weight:800}.stop{margin-top:10px;background:rgba(255,255,255,.07);color:white;border:1px solid rgba(255,255,255,.12)}.status{padding:14px;border-radius:16px;background:rgba(255,255,255,.06);margin:16px 0}.hint{opacity:.65;line-height:1.5;font-size:14px}.err{display:none;margin-top:12px;padding:12px;background:rgba(239,68,68,.12);border-radius:12px}</style></head><body><main class="wrap"><div class="brand">NEXO VOICE · C LAB</div><section class="card"><h1>Vamos a por la más humana</h1><p class="hint">C fue la ganadora. Ahora comparamos tres evoluciones de esa misma línea.</p><div class="versions"><button class="v active" data-v="C2">C2</button><button class="v" data-v="C3">C3</button><button class="v" data-v="C4">C4</button></div><div class="status" id="status">C2 · lista</div><button class="main" id="start">🎙️ Empezar C2</button><button class="main stop" id="stop" disabled>Finalizar prueba</button><div class="err" id="err"></div><audio id="remote" autoplay style="display:none"></audio><p class="hint">C2 = natural directa · C3 = más espontánea · C4 = máxima sensación de conversación real.</p></section></main><script>
let selected='C2',pc,dc,stream;const status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop'),err=document.getElementById('err'),remote=document.getElementById('remote');
const base=`Habla siempre en español de España. Voz cedar. Atiendes el teléfono como una persona real de la empresa, no como una IA ni una centralita. Sé cercana, tranquila, resolutiva y profesional. Escucha el significado de lo que te dicen y contesta a eso, no a una plantilla. Haz como máximo una pregunta cada vez. No repitas ni resumas lo que acaba de decir el cliente salvo que sea necesario aclararlo. No anuncies lo que vas a hacer. No digas frases de proceso como “voy a tomar unos datos”, “procederé”, “he registrado”, “para poder ayudarte necesito” o “entiendo que necesitas”. Pregunta directamente lo necesario. Evita listas, explicaciones largas y lenguaje de atención al cliente prefabricado. No inventes acciones realizadas. Aurenexo se pronuncia “Aura Nexo”.`;
const cfg={C2:{voice:'cedar',style:`${base} Habla de manera sencilla y cotidiana. La mayoría de tus turnos deben ser de una o dos frases. Si basta con “sí”, “claro”, “dime” o una pregunta directa, no añadas nada más. No adornes las respuestas.`},C3:{voice:'cedar',style:`${base} Conversa con espontaneidad. Varía mucho cómo empiezas las respuestas y no uses automáticamente “vale”, “perfecto”, “claro” o “entiendo”. A veces responde directamente sin ninguna frase de cortesía. Reacciona al contexto: una avería urgente no se trata igual que una consulta de precio. Usa lenguaje oral, no lenguaje escrito.`},C4:{voice:'cedar',style:`${base} Tu prioridad absoluta es que la conversación parezca humana. No intentes sonar servicial en cada frase: una persona real a menudo simplemente pregunta, confirma o responde. Alterna respuestas muy breves con otras algo más completas cuando haga falta. Permite pequeñas pausas naturales y cambios de ritmo. No cierres cada intervención con una fórmula amable. No conviertas cada mensaje en estructura respuesta+explicación+pregunta. Si ya sabes qué preguntar, pregunta directamente. Evita repetir palabras y patrones de los turnos anteriores. Sé cálida por la forma de hablar, no por añadir frases de cortesía.`}};
function setUI(){document.querySelectorAll('.v').forEach(b=>b.classList.toggle('active',b.dataset.v===selected));start.textContent='🎙️ Empezar '+selected;status.textContent=selected+' · lista'}document.querySelectorAll('.v').forEach(b=>b.onclick=()=>{if(pc)return;selected=b.dataset.v;setUI()});
function cleanup(){try{dc?.close()}catch{}try{pc?.close()}catch{}stream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{}pc=dc=stream=null;start.disabled=false;stop.disabled=true;setUI()}
start.onclick=async()=>{start.disabled=true;err.style.display='none';status.textContent=selected+' · conectando…';try{stream=await navigator.mediaDevices.getUserMedia({audio:true});pc=new RTCPeerConnection();pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};stream.getTracks().forEach(t=>pc.addTrack(t,stream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{status.textContent=selected+' · escuchando';stop.disabled=false;const c=cfg[selected];dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:c.style,audio:{output:{voice:c.voice}}}}));setTimeout(()=>dc?.readyState==='open'&&dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:`Acabas de coger el teléfono. Saluda de forma breve y natural: 'Hola, soy Nexo Voice, de Aura Nexo. Dime, ¿en qué te puedo ayudar?' Después habla como una persona real siguiendo el estilo configurado.`}})),150)};dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='error'){err.style.display='block';err.textContent=JSON.stringify(x.error||x)}}catch{}};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))cleanup()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});const body=await r.text();if(!r.ok)throw new Error(body);await pc.setRemoteDescription({type:'answer',sdp:body})}catch(e){cleanup();err.style.display='block';err.textContent=e.message||String(e)}};stop.onclick=cleanup;window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);setUI();
</script></body></html>
