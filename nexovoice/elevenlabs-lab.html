<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Nexo Voice · Prueba ElevenLabs</title><link rel="icon" href="/app-icon.svg?v=4" type="image/svg+xml"><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--gold:#d6ab5c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#090909,#030303 60%,#111);color:#fff;padding:20px}.wrap{max-width:820px;margin:18px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.top img{width:185px}.top a{color:#bbb;text-decoration:none}.card{margin-top:18px;background:#0c0c0def;border:1px solid #d6ab5c44;border-radius:26px;padding:28px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(32px,7vw,52px);margin:10px 0}.sub{color:#aaa;line-height:1.55}.status{margin:18px 0;padding:14px 16px;border-radius:14px;background:#ffffff09}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.voice{padding:16px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff08}.voice b{display:block;font-size:18px}.voice small{display:block;color:#999;margin:6px 0 12px}.voice button{width:100%;border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer;background:#f0d58e;color:#111}.empty{color:#999;padding:18px 0}.error{display:none;background:#ef444422;color:#ffcaca;padding:12px;border-radius:12px;margin-top:12px}audio{width:100%;margin-top:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:21px}}</style></head><body><div class="wrap"><div class="top"><a href="/"><img src="/logo-nexo-voice.svg" alt="Nexo Voice"></a><a href="/voice-lab.html">Voces actuales →</a></div><main class="card"><div class="eyebrow">Comparativa de voz</div><h1>Prueba voces de ElevenLabs.</h1><p class="sub">Escucha distintas voces con la misma presentación de Nexo Voice. Esto es solo una prueba de naturalidad; no cambia la configuración actual.</p><div id="status" class="status">Cargando voces…</div><div id="voices" class="grid"></div><div id="error" class="error"></div><audio id="player" controls></audio></main></div><script>
const box=document.getElementById('voices'),status=document.getElementById('status'),error=document.getElementById('error'),player=document.getElementById('player');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function preview(v){error.style.display='none';status.textContent='Generando prueba de '+v.name+'…';const gender=String(v.labels?.gender||'').toLowerCase();const name=gender.includes('male')&&!gender.includes('female')?'Rafa':'Carla';const role=name==='Carla'?'la asistente personal':'el asistente personal';const text=`Hola, soy ${name}, ${role} de Nexo Voice. Dime, ¿en qué puedo ayudarte?`;try{const r=await fetch('/api/elevenlabs-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_id:v.voice_id,text})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error==='elevenlabs_not_configured'?'Falta conectar ElevenLabs al servidor.':(d.detail||d.error||'No se pudo generar la voz'))}const blob=await r.blob();player.src=URL.createObjectURL(blob);await player.play();status.textContent='Escuchando: '+v.name}catch(e){error.style.display='block';error.textContent=e.message;status.textContent='Prueba no disponible'}}
async function load(){try{const r=await fetch('/api/elevenlabs-voices',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error==='elevenlabs_not_configured'?'ElevenLabs todavía no está conectado al servidor.':'No se pudieron cargar las voces');const voices=(d.voices||[]).filter(v=>{const lang=JSON.stringify(v.labels||{}).toLowerCase();return lang.includes('spanish')||lang.includes('spain')||lang.includes('españ')}).slice(0,12);const list=voices.length?voices:(d.voices||[]).slice(0,12);status.textContent=list.length?'Elige una voz y pulsa Probar.':'No se encontraron voces disponibles.';box.innerHTML=list.map((v,i)=>`<div class="voice"><b>${esc(v.name)}</b><small>${esc([v.labels?.gender,v.labels?.accent,v.labels?.age].filter(Boolean).join(' · ')||v.category||'Voz')}</small><button data-i="${i}">▶ Probar</button></div>`).join('')||'<div class="empty">Sin voces.</div>';box.querySelectorAll('button').forEach(b=>b.onclick=()=>preview(list[Number(b.dataset.i)]))}catch(e){status.textContent=e.message;box.innerHTML='';}}
load();
</script></body></html>
