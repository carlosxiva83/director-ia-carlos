<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Nexo Voice · Candidatas ElevenLabs</title><link rel="icon" href="/app-icon.svg?v=4" type="image/svg+xml"><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--gold:#d6ab5c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#090909,#030303 60%,#111);color:#fff;padding:20px}.wrap{max-width:920px;margin:18px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.top img{width:185px}.top a{color:#bbb;text-decoration:none}.card{margin-top:18px;background:#0c0c0def;border:1px solid #d6ab5c44;border-radius:26px;padding:28px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(32px,7vw,52px);margin:10px 0}.sub{color:#aaa;line-height:1.55}.status{margin:18px 0;padding:14px 16px;border-radius:14px;background:#ffffff09}.section{margin-top:26px}.section h2{font-size:22px;margin:0 0 12px}.section p{color:#999;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.voice{position:relative;padding:16px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff08}.voice.candidate{border-color:#d6ab5c66;background:#d6ab5c10}.badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#0b0b0b;background:#e7c980;padding:5px 8px;border-radius:999px;margin-bottom:9px;font-weight:900}.voice b{display:block;font-size:19px}.voice small{display:block;color:#999;margin:6px 0 12px;line-height:1.4}.voice button{width:100%;border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer;background:#f0d58e;color:#111}.empty{color:#999;padding:18px 0}.error{display:none;background:#ef444422;color:#ffcaca;padding:12px;border-radius:12px;margin-top:12px}audio{width:100%;margin-top:16px}.more{margin-top:18px;width:100%;border:1px solid #ffffff20;background:#ffffff0b;color:#fff;padding:13px;border-radius:14px;font-weight:800;cursor:pointer}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:21px}}</style></head><body><div class="wrap"><div class="top"><a href="/"><img src="/logo-nexo-voice.svg" alt="Nexo Voice"></a><a href="/voice-lab.html">Carla y Rafa →</a></div><main class="card"><div class="eyebrow">Selección Nexo Voice</div><h1>Volvamos a escuchar tus cinco.</h1><p class="sub">He puesto arriba exactamente las que has elegido: Adriana Angel, Matilda, Will, Bella y Charlie. Todas con la misma frase para compararlas bien.</p><div id="status" class="status">Cargando voces de ElevenLabs…</div><section class="section"><h2>⭐ Tus 5 candidatas</h2><div id="candidates" class="grid"></div></section><section class="section"><h2>Más voces para comparar</h2><div id="voices" class="grid"></div><button id="more" class="more" style="display:none">Ver más voces</button></section><div id="error" class="error"></div><audio id="player" controls></audio></main></div><script>
const box=document.getElementById('voices'),candidates=document.getElementById('candidates'),status=document.getElementById('status'),error=document.getElementById('error'),player=document.getElementById('player'),more=document.getElementById('more');let all=[],shown=12;const wanted=['adriana angel','matilda','will','bella','charlie'];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function gender(v){const g=String(v.labels?.gender||'').toLowerCase();if(g.includes('female')||g.includes('woman')||g.includes('mujer'))return'female';if(g.includes('male')||g.includes('man')||g.includes('hombre'))return'male';return'unknown'}
function meta(v){return [v.labels?.gender,v.labels?.accent,v.labels?.age,v.labels?.descriptive].filter(Boolean).join(' · ')||v.category||'Voz ElevenLabs'}
function card(v,candidate=false){return `<div class="voice ${candidate?'candidate':''}">${candidate?'<span class="badge">Tu candidata</span>':''}<b>${esc(v.name)}</b><small>${esc(meta(v))}</small><button data-id="${esc(v.voice_id)}">▶ Probar voz</button></div>`}
async function preview(v){error.style.display='none';status.textContent='Generando prueba de '+v.name+'…';const text='Hola, gracias por llamar a Nexo Voice. Cuéntame, ¿en qué puedo ayudarte hoy? Estoy aquí para atenderte y resolver lo que necesites.';try{const r=await fetch('/api/elevenlabs-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_id:v.voice_id,text})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||d.error||'No se pudo generar la voz')}const blob=await r.blob();player.src=URL.createObjectURL(blob);await player.play();status.textContent='Escuchando: '+v.name}catch(e){error.style.display='block';error.textContent=e.message;status.textContent='Prueba no disponible'}}
function wire(root){root.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{const v=all.find(x=>x.voice_id===b.dataset.id);if(v)preview(v)})}
function renderMore(){const extras=all.filter(v=>!window.pickIds.has(v.voice_id)).slice(0,shown);box.innerHTML=extras.map(v=>card(v)).join('')||'<div class="empty">No hay más voces disponibles.</div>';wire(box);more.style.display=extras.length<all.filter(v=>!window.pickIds.has(v.voice_id)).length?'block':'none'}
async function load(){try{const r=await fetch('/api/elevenlabs-voices',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error('No se pudieron cargar las voces');all=d.voices||[];const picks=[];for(const w of wanted){const v=all.find(x=>String(x.name||'').toLowerCase().startsWith(w));if(v&&!picks.includes(v))picks.push(v)}window.pickIds=new Set(picks.map(v=>v.voice_id));candidates.innerHTML=picks.map(v=>card(v,true)).join('')||'<div class="empty">No se encontraron esas voces en la biblioteca actual.</div>';wire(candidates);status.textContent=picks.length===5?'Ya están las cinco preparadas para comparar.':`He encontrado ${picks.length} de las 5 candidatas.`;renderMore()}catch(e){status.textContent=e.message;candidates.innerHTML='';box.innerHTML=''}}
more.onclick=()=>{shown+=12;renderMore()};load();
</script></body></html>
