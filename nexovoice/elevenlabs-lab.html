<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Nexo Voice · Finalistas ElevenLabs</title><link rel="icon" href="/app-icon.svg?v=4" type="image/svg+xml"><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--gold:#d6ab5c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#090909,#030303 60%,#111);color:#fff;padding:20px}.wrap{max-width:820px;margin:18px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.top img{width:185px}.top a{color:#bbb;text-decoration:none}.card{margin-top:18px;background:#0c0c0def;border:1px solid #d6ab5c44;border-radius:26px;padding:28px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(32px,7vw,50px);margin:10px 0}.sub{color:#aaa;line-height:1.55}.status{margin:18px 0;padding:14px 16px;border-radius:14px;background:#ffffff09}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.voice{position:relative;padding:18px;border:1px solid #d6ab5c66;border-radius:18px;background:#d6ab5c10}.badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#0b0b0b;background:#e7c980;padding:5px 8px;border-radius:999px;margin-bottom:9px;font-weight:900}.voice b{display:block;font-size:20px}.voice small{display:block;color:#999;margin:6px 0 12px;line-height:1.4}.voice button{width:100%;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;background:#f0d58e;color:#111}.empty{color:#999;padding:18px 0}.error{display:none;background:#ef444422;color:#ffcaca;padding:12px;border-radius:12px;margin-top:12px}audio{width:100%;margin-top:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:21px}}</style></head><body><div class="wrap"><div class="top"><a href="/"><img src="/logo-nexo-voice.svg" alt="Nexo Voice"></a></div><main class="card"><div class="eyebrow">Finalistas Nexo Voice</div><h1>Las 4 voces que has elegido.</h1><p class="sub">Bella, Charlie, Siena y Alejandra. Todas reproducen exactamente la misma frase para compararlas bien.</p><div id="status" class="status">Cargando finalistas…</div><div id="voices" class="grid"></div><div id="error" class="error"></div><audio id="player" controls></audio></main></div><script>
const box=document.getElementById('voices'),status=document.getElementById('status'),error=document.getElementById('error'),player=document.getElementById('player');let all=[];const wanted=['bella','charlie','siena','alejandra'];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function meta(v){return [v.labels?.gender,v.labels?.accent,v.labels?.age,v.labels?.descriptive].filter(Boolean).join(' · ')||v.category||'Voz ElevenLabs'}
function card(v){return `<div class="voice"><span class="badge">Finalista</span><b>${esc(v.name)}</b><small>${esc(meta(v))}</small><button data-id="${esc(v.voice_id)}">▶ Probar voz</button></div>`}
async function preview(v){error.style.display='none';status.textContent='Generando prueba de '+v.name+'…';const text='Hola, gracias por llamar. Soy el asistente de Nexo Voice. Cuéntame, ¿en qué puedo ayudarte hoy?';try{const r=await fetch('/api/elevenlabs-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_id:v.voice_id,text})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||d.error||'No se pudo generar la voz')}const blob=await r.blob();player.src=URL.createObjectURL(blob);await player.play();status.textContent='Escuchando: '+v.name}catch(e){error.style.display='block';error.textContent=e.message;status.textContent='Prueba no disponible'}}
function wire(){box.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{const v=all.find(x=>x.voice_id===b.dataset.id);if(v)preview(v)})}
async function load(){try{const r=await fetch('/api/elevenlabs-voices',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error('No se pudieron cargar las voces');all=d.voices||[];const picks=[];for(const w of wanted){const v=all.find(x=>String(x.name||'').toLowerCase().startsWith(w));if(v&&!picks.includes(v))picks.push(v)}box.innerHTML=picks.map(card).join('')||'<div class="empty">No se encontraron las finalistas.</div>';wire();status.textContent=picks.length===4?'Las cuatro finalistas están listas.':`He encontrado ${picks.length} de las 4 finalistas.`}catch(e){status.textContent=e.message;box.innerHTML=''}}
load();
</script></body></html>
