<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Voice · Hostelecan C4.1</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17304c,#07111f 48%,#02060c);color:#fff;padding:22px;display:grid;place-items:center}.wrap{width:min(680px,100%)}.brand{font-weight:800;letter-spacing:.08em}.card{background:rgba(8,20,36,.88);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px;margin-top:18px}h1{font-size:34px;margin:0 0 8px}.sub{opacity:.72;line-height:1.5}.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.area,.status{padding:14px;border-radius:15px;background:rgba(255,255,255,.055)}button{width:100%;border:0;border-radius:18px;padding:17px;font-size:17px;font-weight:800}#start{background:#fff;color:#07111f}#stop{margin-top:10px;background:rgba(255,255,255,.08);color:#fff}button:disabled{opacity:.45}#error{display:none;margin-top:14px;padding:12px;background:rgba(239,68,68,.12);border-radius:14px}audio{display:none}</style></head><body><main class="wrap"><div class="brand">NEXO VOICE · HOSTELECAN · C4.1</div><section class="card"><h1>Recepción inteligente Hostelecan</h1><p class="sub">C4.1 con conocimiento del equipo y consulta del catálogo público de Hostelecan.</p><div class="areas"><div class="area">🛠️ Servicio técnico</div><div class="area">🧾 Administración</div><div class="area">💼 Comercial + catálogo</div><div class="area">💬 Consultas generales</div></div><div class="status" id="status">Listo para probar</div><button id="start">🎙️ Empezar conversación</button><button id="stop" disabled>Finalizar prueba</button><div id="error"></div><audio id="remote" autoplay></audio></section></main><script>
let pc,dc,localStream,PROFILE=null;let greetingSent=false,initialGreeting=true;const startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop'),statusEl=document.getElementById('status'),remote=document.getElementById('remote'),errorEl=document.getElementById('error');
const STYLE=`Habla siempre en español de España. Eres Nexo Voice y atiendes Hostelecan con un trato humano, cercano, tranquilo y resolutivo. No suenes a centralita ni a formulario. Recuerda activamente todo lo que el cliente haya dicho durante la conversación y nunca vuelvas a pedir un dato ya proporcionado. Si proporciona varios datos de golpe, aprovéchalos todos y pregunta únicamente por lo que falte. No repitas ni resumas lo que acaba de decir salvo que exista una duda real. No respondas automáticamente “perfecto”, “vale”, “claro”, “entiendo” o “de acuerdo” después de cada dato. No anuncies procesos. Cuando necesites datos básicos compatibles, pídelos juntos. No sigas el orden de un formulario. Alterna respuestas muy breves con otras más completas cuando haga falta. Usa lenguaje oral y variado. Preséntate solo una vez al inicio. Después, aunque el cliente diga hola, no vuelvas a presentarte ni encadenes saludos repetidos. Cuando el cliente pregunte por un producto, precio, modelo o disponibilidad de algo visto en la web, utiliza la herramienta buscar_producto_hostelecan antes de contestar si necesitas comprobar el catálogo. Si el cliente solo recuerda el tipo de máquina y un precio aproximado, busca por el tipo y usa el precio aproximado para identificar la coincidencia más probable. Si hay varias coincidencias razonables, pregunta únicamente el dato mínimo para distinguirlas. Nunca inventes stock. Si la herramienta devuelve in_stock=true, puedes decir que la tienda web lo marca disponible/en stock, pero aclara si es importante que eso no confirma una unidad física concreta en almacén. No inventes que has enviado, registrado o transferido algo si no está conectado.`;
const PRODUCT_TOOL={type:'function',name:'buscar_producto_hostelecan',description:'Consulta el catálogo público real de Hostelecan. Úsala para productos, modelos, precios o disponibilidad publicada. Si el cliente recuerda un precio aproximado, inclúyelo.',parameters:{type:'object',properties:{query:{type:'string',description:'Tipo, nombre, marca, modelo o descripción breve del producto. No metas frases completas; por ejemplo lavavajillas, horno, freidora o CH400.'},precio_aproximado:{type:'number',description:'Precio aproximado en euros si el cliente lo menciona.'}},required:['query']}};
async function loadProfile(){if(PROFILE)return PROFILE;const r=await fetch('/profiles/hostelecan.json',{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar el perfil');PROFILE=await r.json();return PROFILE}
function build(p){return `${STYLE}\n\n${p.business_context}\n\nEQUIPO:\n${(p.team||[]).map(x=>`- ${x.name}: ${x.role}.`).join('\n')}\n\nHORARIO:\nTienda abierta de 09:00 a 14:00 y de 16:00 a 20:00. Nexo Voice atiende 24 horas y fuera de horario recoge consultas y avisos sin prometer atención humana inmediata.\n\nDEPARTAMENTOS:\n${p.departments.map(d=>`- ${d.name}: motivos ${d.intent_examples.join(', ')}. Datos útiles: ${d.collect.join(', ')}.`).join('\n')}\n\nREGLAS DE NEGOCIO:\n${p.rules.map(r=>'- '+r).join('\n')}`}
async function runProductTool(args){const q=String(args?.query||'').trim();const price=Number(args?.precio_aproximado||0)||'';const url='/api/hostelecan-products?q='+encodeURIComponent(q)+(price?'&price='+encodeURIComponent(price):'');const r=await fetch(url,{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudo consultar el catálogo');return data}
async function handleToolCall(ev){if(ev.name!=='buscar_producto_hostelecan')return;let args={};try{args=JSON.parse(ev.arguments||'{}')}catch{}statusEl.textContent='Consultando catálogo de Hostelecan…';let output;try{output=await runProductTool(args)}catch(e){output={error:e.message||String(e)}}if(dc?.readyState!=='open')return;dc.send(JSON.stringify({type:'conversation.item.create',item:{type:'function_call_output',call_id:ev.call_id,output:JSON.stringify(output)}}));dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:'Continúa la conversación con naturalidad. Usa el resultado de la consulta del catálogo. No leas listas largas: da primero la coincidencia más probable y pregunta solo si necesitas distinguir entre varias.'}}));statusEl.textContent='Nexo Voice está escuchando'}
function setMic(on){localStream?.getAudioTracks().forEach(t=>t.enabled=on)}
function cleanup(){try{dc?.close()}catch{}try{pc?.close()}catch{}localStream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{}pc=dc=localStream=null;greetingSent=false;initialGreeting=true;startBtn.disabled=false;stopBtn.disabled=true;statusEl.textContent='Listo para probar'}
function sendGreeting(p){if(greetingSent||dc?.readyState!=='open')return;greetingSent=true;statusEl.textContent='Nexo Voice se está presentando…';dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:`Haz una única presentación breve y natural: '${p.greeting}'. Dila una sola vez. Después no vuelvas a presentarte salvo que el cliente te pregunte quién eres.`}}))}
startBtn.onclick=async()=>{startBtn.disabled=true;errorEl.style.display='none';statusEl.textContent='Conectando…';try{const p=await loadProfile();localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});setMic(false);pc=new RTCPeerConnection();pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{stopBtn.disabled=false;statusEl.textContent='Preparando Nexo Voice…';dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:build(p),audio:{output:{voice:'cedar'}},tools:[PRODUCT_TOOL],tool_choice:'auto'}}))};dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='session.updated')sendGreeting(p);if(x.type==='response.function_call_arguments.done')handleToolCall(x);if(x.type==='response.done'&&initialGreeting){initialGreeting=false;setMic(true);statusEl.textContent='Nexo Voice está escuchando'}if(x.type==='error'){errorEl.style.display='block';errorEl.textContent=JSON.stringify(x.error||x);if(initialGreeting){initialGreeting=false;setMic(true)}}}catch{}};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))cleanup()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});const body=await r.text();if(!r.ok)throw new Error(body);await pc.setRemoteDescription({type:'answer',sdp:body})}catch(e){cleanup();errorEl.style.display='block';errorEl.textContent=e.message||String(e)}};stopBtn.onclick=cleanup;window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);
</script></body></html>
