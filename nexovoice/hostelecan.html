<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Voice · Hostelecan C4.1</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17304c,#07111f 48%,#02060c);color:#fff;padding:22px;display:grid;place-items:center}.wrap{width:min(680px,100%)}.brand{font-weight:800;letter-spacing:.08em}.card{background:rgba(8,20,36,.88);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px;margin-top:18px}h1{font-size:34px;margin:0 0 8px}.sub{opacity:.72;line-height:1.5}.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.area,.status{padding:14px;border-radius:15px;background:rgba(255,255,255,.055)}button{width:100%;border:0;border-radius:18px;padding:17px;font-size:17px;font-weight:800}#start{background:#fff;color:#07111f}#stop{margin-top:10px;background:rgba(255,255,255,.08);color:#fff}button:disabled{opacity:.45}#error{display:none;margin-top:14px;padding:12px;background:rgba(239,68,68,.12);border-radius:14px}audio{display:none}</style></head><body><main class="wrap"><div class="brand">NEXO VOICE · HOSTELECAN · C4.1</div><section class="card"><h1>Recepción inteligente Hostelecan</h1><p class="sub">Versión C4.1 con conversación natural y memoria de los datos ya proporcionados.</p><div class="areas"><div class="area">🛠️ Servicio técnico</div><div class="area">🧾 Administración</div><div class="area">💼 Comercial</div><div class="area">💬 Consultas generales</div></div><div class="status" id="status">Listo para probar</div><button id="start">🎙️ Empezar conversación</button><button id="stop" disabled>Finalizar prueba</button><div id="error"></div><audio id="remote" autoplay></audio></section></main><script>
let pc,dc,localStream,PROFILE=null;const startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop'),statusEl=document.getElementById('status'),remote=document.getElementById('remote'),errorEl=document.getElementById('error');
const STYLE=`Habla siempre en español de España. Eres Nexo Voice y atiendes Hostelecan con un trato humano, cercano, tranquilo y resolutivo. No suenes a centralita ni a formulario. Recuerda activamente todo lo que el cliente haya dicho durante la conversación y nunca vuelvas a pedir un dato ya proporcionado, aunque lo dijera antes de que lo preguntaras o mezclado con otros datos. Si proporciona varios datos de golpe, aprovéchalos todos y pregunta únicamente por lo que falte. No repitas ni resumas lo que acaba de decir salvo que exista una duda real. No respondas automáticamente “perfecto”, “vale”, “claro”, “entiendo” o “de acuerdo” después de cada dato. No anuncies procesos ni digas “voy a tomar unos datos”, “quiero pedirte unos datos”, “para poder ayudarte necesito” o similares. Cuando necesites datos básicos compatibles, pídelos juntos: por ejemplo, “Dime tu nombre y un teléfono de contacto”. Si ya sabes uno, pide solo el que falta. Después pregunta conversando los detalles que requieren explicación, como avería, máquina, modelo, medidas o urgencia. No sigas el orden de un formulario: sigue el orden natural de la conversación. Alterna respuestas muy breves con otras más completas cuando haga falta. Usa lenguaje oral y variado. No inventes que has enviado, registrado o transferido algo si no está conectado.`;
async function loadProfile(){if(PROFILE)return PROFILE;const r=await fetch('/profiles/hostelecan.json',{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar el perfil');PROFILE=await r.json();return PROFILE}function build(p){return `${STYLE}\n\n${p.business_context}\n\nDEPARTAMENTOS:\n${p.departments.map(d=>`- ${d.name}: motivos ${d.intent_examples.join(', ')}. Datos útiles: ${d.collect.join(', ')}.`).join('\n')}\n\nREGLAS DE NEGOCIO:\n${p.rules.map(r=>'- '+r).join('\n')}`}
function cleanup(){try{dc?.close()}catch{}try{pc?.close()}catch{}localStream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{}pc=dc=localStream=null;startBtn.disabled=false;stopBtn.disabled=true;statusEl.textContent='Listo para probar'}
startBtn.onclick=async()=>{startBtn.disabled=true;errorEl.style.display='none';statusEl.textContent='Conectando…';try{const p=await loadProfile();localStream=await navigator.mediaDevices.getUserMedia({audio:true});pc=new RTCPeerConnection();pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{statusEl.textContent='Nexo Voice está escuchando';stopBtn.disabled=false;dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:build(p),audio:{output:{voice:'cedar'}}}}));setTimeout(()=>dc?.readyState==='open'&&dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:`Saluda breve y natural: '${p.greeting}'. Después conversa siguiendo C4.1, recordando todo dato que el cliente te dé.`}})),150)};dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='error'){errorEl.style.display='block';errorEl.textContent=JSON.stringify(x.error||x)}}catch{}};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))cleanup()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});const body=await r.text();if(!r.ok)throw new Error(body);await pc.setRemoteDescription({type:'answer',sdp:body})}catch(e){cleanup();errorEl.style.display='block';errorEl.textContent=e.message||String(e)}};stopBtn.onclick=cleanup;window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);
</script></body></html>
