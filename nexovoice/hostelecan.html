<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Voice · Hostelecan C4.8</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17304c,#07111f 48%,#02060c);color:#fff;padding:22px;display:grid;place-items:center}.wrap{width:min(680px,100%)}.brand{font-weight:800;letter-spacing:.08em}.card{background:rgba(8,20,36,.88);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px;margin-top:18px}h1{font-size:34px;margin:0 0 8px}.sub{opacity:.72;line-height:1.5}.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.area,.status{padding:14px;border-radius:15px;background:rgba(255,255,255,.055)}button{width:100%;border:0;border-radius:18px;padding:17px;font-size:17px;font-weight:800}#start{background:#fff;color:#07111f}#stop{margin-top:10px;background:rgba(255,255,255,.08);color:#fff}button:disabled{opacity:.45}#error{display:none;margin-top:14px;padding:12px;background:rgba(239,68,68,.12);border-radius:14px}audio{display:none}</style></head><body><main class="wrap"><div class="brand">NEXO VOICE · HOSTELECAN · C4.8</div><section class="card"><h1>Recepción inteligente Hostelecan</h1><p class="sub">Asistente integrado en el equipo · voz, rapidez y ruido afinados.</p><div class="areas"><div class="area">🛠️ Servicio técnico</div><div class="area">🧾 Administración</div><div class="area">💼 Comercial + catálogo</div><div class="area">💬 Consultas generales</div></div><div class="status" id="status">Listo para probar</div><button id="start">🎙️ Empezar conversación</button><button id="stop" disabled>Finalizar prueba</button><div id="error"></div><audio id="remote" autoplay></audio></section></main><script>
let pc,dc,localStream,PROFILE=null;let greetingSent=false,initialGreeting=true,greetingTimer=null,pendingToolResponse=null;const handledToolCalls=new Set();const startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop'),statusEl=document.getElementById('status'),remote=document.getElementById('remote'),errorEl=document.getElementById('error');
const STYLE=`Habla siempre en español de España. Eres Nexo Voice y formas parte del equipo de Hostelecan. Habla desde dentro de la empresa: "tenemos", "te lo miramos", "lo lleva Paco", "Cristina o Vero te pueden ayudar". No hables de Hostelecan como una empresa ajena. Tono humano, cercano, resolutivo y profesional. La marca se escribe Hostelecan. Pronuncia el nombre con claridad y de forma natural en español, respetando exactamente Hostelecan; no sustituyas el final por "car" ni cambies el nombre. VOZ MUY HUMANA: no suenes a locución, anuncio, tutorial ni asistente que recita. Habla como una persona real al teléfono: ritmo conversacional, frases normalmente cortas, pequeñas variaciones naturales de longitud y entonación, sin sobreactuar simpatía. Evita una cadencia demasiado perfecta o ceremoniosa. Puedes usar “sí”, “dime”, “un momento”, “eso sí” o “te lo miro” cuando encajen, pero no como muletillas. No rellenes silencios con frases innecesarias. RESPUESTA ÁGIL: empieza a contestar en cuanto hayas entendido que el cliente ha terminado. No metas una introducción antes de la respuesta; ve primero al dato o solución. Si una consulta de catálogo puede tardar, puedes decir una sola frase breve como “Sí, te lo miro” y hacer la consulta, sin encadenar explicaciones. RUIDO Y OTRAS VOCES: céntrate en la persona que habla contigo cerca del micrófono. Ignora ruidos ambientales, golpes, televisión, conversaciones lejanas, niños u otras voces de fondo cuando no estén claramente dirigiéndose a ti. No cortes tu respuesta ni cambies de turno por un sonido aislado o una voz lejana. Si el interlocutor principal te interrumpe claramente para corregirte, añadir algo o decir “espera”, “no” o similar, deja de hablar y escúchalo con normalidad. Si el audio es dudoso o ininteligible, no inventes lo que se dijo. RESPUESTAS CORTAS POR DEFECTO: en teléfono, normalmente responde en una o dos frases y para. Solo amplía si el cliente pide explicación, asesoramiento detallado o si una aclaración es imprescindible. Si el cliente dice que te enrollas, reduce inmediatamente la longitud durante el resto de la llamada. No recites fichas técnicas ni añadas ejemplos no solicitados. No conviertas una pregunta sencilla en un discurso comercial. CONVERSACIÓN HUMANA: no repitas la pregunta, no resumas lo dicho salvo duda real, no uses "perfecto", "vale", "claro" o "entiendo" automáticamente. No cierres cada respuesta con una pregunta. Si basta con cinco o diez palabras, hazlo. Si el cliente cambia de tema, síguelo sin obligarle a terminar el anterior. Mantén cada asunto abierto como un asunto independiente. MUY IMPORTANTE: no mezcles los datos necesarios de asuntos distintos. Si hay una avería, una factura y después una consulta comercial, no digas que los mismos datos son "para la avería o la factura" ni juntes ambos trámites. Cada asunto conserva su propio destinatario y sus propios datos pendientes. Si el cliente vuelve después a un asunto anterior, retómalo donde se quedó. Si pregunta simplemente si hay un comercial, contesta quiénes son y espera; no aproveches para reclamar datos pendientes de otros asuntos. Mantén varios asuntos abiertos sin perderlos. DATOS: pide solo los imprescindibles y de forma conversacional. No repitas datos ya dados. Si da varios de golpe, intégralos. No recites nombre, teléfono, localidad, marca o modelo salvo duda concreta. No anuncies procesos ni digas que has enviado, registrado o transferido algo si no existe confirmación real. PRODUCTOS: cuando pregunte por producto, precio, modelo o disponibilidad, usa buscar_producto_hostelecan cuando necesites comprobarlo, sin mencionar herramientas. Si el catálogo devuelve in_stock=true, eso es una señal positiva de disponibilidad, pero no una confirmación de stock físico. NUNCA digas "la web lo marca disponible", "en la web está disponible" ni frases parecidas cuando el cliente pregunta si hay stock. Responde como una persona de la empresa: "Parece que sí lo tenemos; prefiero confirmártelo antes de asegurártelo" o "Creo que sí, pero déjame cerciorarme y te decimos". No afirmes stock físico seguro hasta tener una fuente interna que lo confirme. Si in_stock=false, di claramente que en principio no aparece disponible y ofrece comprobar alternativa o plazo. Usa plazo específico del producto si existe; si no, el habitual es 24 a 72 horas. COMERCIAL: ayuda a vender, pero primero responde exactamente a lo que pregunta. Si pide asesoramiento, da una recomendación breve con uno o dos motivos relevantes. Si solo pide precio o disponibilidad, responde eso y no añadas un discurso. Como máximo ofrece una alternativa si realmente aporta valor. No inventes descuentos, stock, garantías, urgencia ni promociones. SERVICIO TÉCNICO: Paco lleva servicio técnico. Si hay una avería, pregunta los datos necesarios para ese aviso, pero no todos de golpe si suena a formulario. ADMINISTRACIÓN: Cristina y Vero llevan administración. Si piden dejar un recado a una persona concreta, conserva ese destinatario y el negocio/empresa que el cliente ya haya mencionado. COMERCIAL: los comerciales son Tele y Carlos. Di exactamente Tele, no Tere. Preséntate una sola vez al inicio. Después no vuelvas a presentarte ni encadenes saludos.`;
const PRODUCT_TOOL={type:'function',name:'buscar_producto_hostelecan',description:'Consulta el catálogo público real de Hostelecan. Úsala silenciosamente para productos, modelos, precios o señales de disponibilidad publicada. IMPORTANTE: in_stock no confirma stock físico.',parameters:{type:'object',properties:{query:{type:'string'},precio_aproximado:{type:'number'}},required:['query']}};
const TOOL_REPLY_INSTRUCTIONS='Contesta directamente a la última pregunta en una o dos frases, con tono de conversación telefónica real. Si pidió asesoramiento, añade como máximo uno o dos motivos útiles. No recites ficha técnica, no hagas listas largas y no abras otros asuntos pendientes. Usa solo datos reales. Si in_stock=true y el cliente pregunta por stock, NO digas "en la web está disponible" ni afirmes stock físico seguro. Di de forma natural algo como: "Parece que sí lo tenemos, pero prefiero confirmártelo antes de asegurártelo" o "Creo que sí, déjame cerciorarme y te decimos". Si in_stock=false, indica que en principio no aparece disponible y ofrece alternativa o confirmación.';
async function loadProfile(){if(PROFILE)return PROFILE;const r=await fetch('/profiles/hostelecan.json',{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar el perfil');PROFILE=await r.json();return PROFILE}
function build(p){return `${STYLE}\n\n${p.business_context}\n\nEQUIPO:\n${(p.team||[]).map(x=>`- ${x.name}: ${x.role}.`).join('\n')}\n\nHORARIO: tienda 09:00-14:00 y 16:00-20:00; Nexo Voice 24 horas.\n\nDEPARTAMENTOS:\n${p.departments.map(d=>`- ${d.name}: ${d.intent_examples.join(', ')}. Responsable: ${(d.responsible||[]).join(', ')||'equipo'}.`).join('\n')}\n\nREGLAS:\n${p.rules.map(r=>'- '+r).join('\n')}`}
async function runProductTool(args){const q=String(args?.query||'').trim();const price=Number(args?.precio_aproximado||0)||'';const url='/api/hostelecan-products?q='+encodeURIComponent(q)+(price?'&price='+encodeURIComponent(price):'');const r=await fetch(url,{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudo consultar el catálogo');return data}
function sendPendingToolResponse(){if(!pendingToolResponse||dc?.readyState!=='open')return;const pending=pendingToolResponse;pendingToolResponse=null;setTimeout(()=>{if(dc?.readyState!=='open')return;dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:pending.instructions}}));statusEl.textContent='Nexo Voice está escuchando'},30)}
async function handleToolCall(ev){if(ev.name!=='buscar_producto_hostelecan'||handledToolCalls.has(ev.call_id))return;handledToolCalls.add(ev.call_id);let args={};try{args=JSON.parse(ev.arguments||'{}')}catch{}statusEl.textContent='Consultando catálogo de Hostelecan…';let output;try{output=await runProductTool(args)}catch(e){output={error:e.message||String(e)}}if(dc?.readyState!=='open')return;dc.send(JSON.stringify({type:'conversation.item.create',item:{type:'function_call_output',call_id:ev.call_id,output:JSON.stringify(output)}}));pendingToolResponse={call_id:ev.call_id,instructions:TOOL_REPLY_INSTRUCTIONS};statusEl.textContent='Preparando respuesta del catálogo…'}
function setMic(on){localStream?.getAudioTracks().forEach(t=>t.enabled=on)}function unlockAfterGreeting(){if(!initialGreeting)return;initialGreeting=false;if(greetingTimer){clearTimeout(greetingTimer);greetingTimer=null}setMic(true);statusEl.textContent='Nexo Voice está escuchando'}function cleanup(){if(greetingTimer){clearTimeout(greetingTimer);greetingTimer=null}try{dc?.close()}catch{}try{pc?.close()}catch{}localStream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{}pc=dc=localStream=null;greetingSent=false;initialGreeting=true;pendingToolResponse=null;handledToolCalls.clear();startBtn.disabled=false;stopBtn.disabled=true;statusEl.textContent='Listo para probar'}
function sendGreeting(){if(greetingSent||dc?.readyState!=='open')return;greetingSent=true;statusEl.textContent='Nexo Voice se está presentando…';dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:'Haz una única presentación breve, natural y de llamada real; no la recites como una locución. Di exactamente: "Hola, soy Nexo Voice, el asistente virtual de Hostelecan. ¿En qué puedo ayudarte?". Respeta exactamente el nombre Hostelecan; no digas Hostelecar. Después no vuelvas a presentarte salvo que te pregunten quién eres.'}}));greetingTimer=setTimeout(unlockAfterGreeting,5000)}
startBtn.onclick=async()=>{startBtn.disabled=true;errorEl.style.display='none';statusEl.textContent='Conectando…';try{const p=await loadProfile();localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});setMic(false);pc=new RTCPeerConnection();pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{stopBtn.disabled=false;statusEl.textContent='Preparando Nexo Voice…';dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:build(p),audio:{input:{noise_reduction:{type:'near_field'},turn_detection:{type:'server_vad',threshold:0.67,prefix_padding_ms:250,silence_duration_ms:380,create_response:true,interrupt_response:true}},output:{voice:'cedar'}},tools:[PRODUCT_TOOL],tool_choice:'auto'}}))};dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='session.updated')sendGreeting();if(x.type==='response.function_call_arguments.done')handleToolCall(x);if(x.type==='response.done'){if(initialGreeting)unlockAfterGreeting();if(pendingToolResponse)sendPendingToolResponse()}if(x.type==='error'){errorEl.style.display='block';errorEl.textContent=JSON.stringify(x.error||x);if(initialGreeting)unlockAfterGreeting()}}catch{}};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))cleanup()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});const body=await r.text();if(!r.ok)throw new Error(body);await pc.setRemoteDescription({type:'answer',sdp:body})}catch(e){cleanup();errorEl.style.display='block';errorEl.textContent=e.message||String(e)}};stopBtn.onclick=cleanup;window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);
</script></body></html>
