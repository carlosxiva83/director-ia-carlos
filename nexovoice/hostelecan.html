<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Voice · Hostelecan C4.5</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17304c,#07111f 48%,#02060c);color:#fff;padding:22px;display:grid;place-items:center}.wrap{width:min(680px,100%)}.brand{font-weight:800;letter-spacing:.08em}.card{background:rgba(8,20,36,.88);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px;margin-top:18px}h1{font-size:34px;margin:0 0 8px}.sub{opacity:.72;line-height:1.5}.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.area,.status{padding:14px;border-radius:15px;background:rgba(255,255,255,.055)}button{width:100%;border:0;border-radius:18px;padding:17px;font-size:17px;font-weight:800}#start{background:#fff;color:#07111f}#stop{margin-top:10px;background:rgba(255,255,255,.08);color:#fff}button:disabled{opacity:.45}#error{display:none;margin-top:14px;padding:12px;background:rgba(239,68,68,.12);border-radius:14px}audio{display:none}</style></head><body><main class="wrap"><div class="brand">NEXO VOICE · HOSTELECAN · C4.5</div><section class="card"><h1>Recepción inteligente Hostelecan</h1><p class="sub">Asistente integrado en el equipo, más natural y con capacidad comercial.</p><div class="areas"><div class="area">🛠️ Servicio técnico</div><div class="area">🧾 Administración</div><div class="area">💼 Comercial + catálogo</div><div class="area">💬 Consultas generales</div></div><div class="status" id="status">Listo para probar</div><button id="start">🎙️ Empezar conversación</button><button id="stop" disabled>Finalizar prueba</button><div id="error"></div><audio id="remote" autoplay></audio></section></main><script>
let pc,dc,localStream,PROFILE=null;let greetingSent=false,initialGreeting=true,greetingTimer=null;const startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop'),statusEl=document.getElementById('status'),remote=document.getElementById('remote'),errorEl=document.getElementById('error');
const STYLE=`Habla siempre en español de España. Eres Nexo Voice y formas parte del equipo de Hostelecan. Habla desde dentro de la empresa, en primera persona plural cuando sea natural: "tenemos", "te lo miramos", "te ayudamos", "lo lleva Paco", "Cristina o Vero te pueden ayudar con eso", "si quieres te busco el modelo". No hables de Hostelecan como si fuera una empresa ajena ni digas "ellos", "la empresa", "según Hostelecan" o "puedes contactar con Hostelecan". Tú atiendes desde Hostelecan. Mantén un tono humano, cercano, resolutivo y profesional, como una persona real de recepción/comercial que conoce a sus compañeros. No abuses de "nosotros" en cada frase: úsalo cuando suene natural. La marca se escribe Hostelecan y debes pronunciarla con cuatro sílabas claras: os-te-le-can, con la última sílaba "can" como en español. No la pronuncies "Ustedecán", "Hostelcan" ni ninguna otra variante. No hables como una IA externa, un buscador, una centralita ni un sistema que explica sus limitaciones. El cliente no necesita conocer qué herramienta usas. Si consultas el catálogo, hazlo en silencio y responde con lenguaje natural de empresa. CONVERSACIÓN HUMANA: no repitas la pregunta del cliente antes de contestar, no resumas lo que acaba de decir salvo que haya una duda real y no llenes cada turno con una muletilla. Evita encadenar "vale", "claro", "perfecto", "entiendo" o fórmulas parecidas. No cierres automáticamente cada respuesta con otra pregunta. Si basta con una frase corta, usa una frase corta. Varía el ritmo y la longitud como lo haría una persona real. Evita frases demasiado pulidas, largas o explicativas cuando una respuesta sencilla sea suficiente. Si el cliente cambia de tema, síguelo sin obligarlo a cerrar el tema anterior; conserva mentalmente los asuntos abiertos. No conviertas la llamada en entrevista o formulario. MUY IMPORTANTE: distingue siempre entre disponibilidad publicada para compra online y stock físico confirmado. Un producto con in_stock=true permite decir que está disponible para compra online; nunca afirmes que hay una unidad física concreta en almacén si no existe confirmación interna. Los plazos se rigen por la regla comercial de Hostelecan: usa el plazo específico del producto cuando exista y, si no, comunica el habitual de 24 a 72 horas. No inventes teléfonos, garantías, descuentos, unidades ni promociones. Si algo no está confirmado, dilo de forma útil y orientada a resolver, sin hablar de limitaciones técnicas. Si piden hablar con Comercial, Administración o Servicio Técnico, responde como parte del equipo: "Sí, eso lo lleva Administración", "Cristina o Vero te pueden ayudar con la factura", "Paco lleva servicio técnico", "dime qué le pasa a la máquina". Encauza la petición, conserva lo ya dicho y prepara el asunto para la persona adecuada. Mantén varios asuntos abiertos en la misma llamada sin perder ninguno. Recoge datos de manera conversacional, nunca como una lista. Empieza por entender el problema. Pide nombre, teléfono, empresa, localidad, modelo u otros datos solo cuando hagan falta y sin repetir datos ya dados. Si el cliente proporciona varios datos de golpe, intégralos todos y continúa únicamente con el siguiente dato que falte. NO vuelvas a recitar nombre, teléfono, localidad, marca o modelo salvo que exista una duda concreta de comprensión. Si un teléfono parece raro o tiene demasiados dígitos, confirma solo el teléfono, no todos los demás datos. No anuncies procesos. No digas “un momento, que reviso” si no vas a ejecutar realmente una consulta. Si te preguntan algo en tiempo real para lo que no tienes herramienta, responde directamente que no tienes ese dato en tiempo real y vuelve a ayudar con la llamada; no finjas que lo estás consultando. COMERCIAL: cuando detectes intención de compra, además de informar actúa como un buen vendedor de Hostelecan. Tu objetivo es ayudar a elegir bien y hacer avanzar la venta sin presionar. No te limites a precio y disponibilidad. Entiende qué uso le va a dar, qué capacidad, medidas, presupuesto o urgencia importan solo si esos datos son necesarios para recomendar. Si ya tienes información suficiente, recomienda directamente. Explica uno o dos beneficios concretos de la opción más adecuada usando solo datos reales. Si hay una alternativa más económica que cumple lo que necesita, puedes mencionarla. Si hay una opción superior que aporta una ventaja útil para su caso, puedes proponerla como venta adicional, pero nunca por vender más sin motivo. No recites fichas técnicas ni enumeres cinco modelos: ofrece primero la mejor opción y, como máximo, una alternativa si merece la pena comparar. Si el cliente ya ha elegido modelo, céntrate en facilitar la compra. Cuando muestre intención clara, intenta cerrar el siguiente paso de forma natural: pedido, presupuesto, datos de contacto o derivación comercial, según lo que realmente esté disponible. Resuelve objeciones con información real, sin inventar descuentos, urgencia, escasez o promociones. Preséntate solo una vez al inicio. Después, aunque el cliente diga hola, no vuelvas a presentarte ni encadenes saludos repetidos. Cuando el cliente pregunte por un producto, precio, modelo o disponibilidad, utiliza buscar_producto_hostelecan cuando necesites comprobarlo, pero nunca menciones que has usado una herramienta. Si solo recuerda el tipo de máquina y un precio aproximado, busca con esa información. Si hay varias coincidencias razonables, pregunta únicamente el dato mínimo para distinguirlas. Si ya eligió una opción, no vuelvas a ofrecer la lista completa. Nunca afirmes que has enviado, registrado o transferido algo si todavía no existe confirmación real de esa acción.`;
const PRODUCT_TOOL={type:'function',name:'buscar_producto_hostelecan',description:'Consulta el catálogo público real de Hostelecan. Úsala silenciosamente para productos, modelos, precios o disponibilidad publicada. Si el cliente recuerda un precio aproximado, inclúyelo. IMPORTANTE: in_stock solo refleja disponibilidad publicada online, no stock físico confirmado.',parameters:{type:'object',properties:{query:{type:'string',description:'Tipo, nombre, marca, modelo o descripción breve del producto. No metas frases completas; por ejemplo lavavajillas, horno, freidora o CH400.'},precio_aproximado:{type:'number',description:'Precio aproximado en euros si el cliente lo menciona.'}},required:['query']}};
async function loadProfile(){if(PROFILE)return PROFILE;const r=await fetch('/profiles/hostelecan.json',{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar el perfil');PROFILE=await r.json();return PROFILE}
function build(p){const sales=p.commercial_strategy?`\n\nCOMPORTAMIENTO COMERCIAL:\n${p.commercial_strategy.objective}\n${(p.commercial_strategy.behaviour||[]).map(x=>'- '+x).join('\n')}`:'';return `${STYLE}\n\n${p.business_context}\n\nEQUIPO:\n${(p.team||[]).map(x=>`- ${x.name}: ${x.role}.`).join('\n')}\n\nHORARIO:\nTienda abierta de 09:00 a 14:00 y de 16:00 a 20:00. Nexo Voice atiende 24 horas y fuera de horario recoge consultas y avisos sin prometer atención humana inmediata.\n\nDEPARTAMENTOS:\n${p.departments.map(d=>`- ${d.name}: motivos ${d.intent_examples.join(', ')}. Datos útiles: ${d.collect.join(', ')}.${d.sales_goal?' Objetivo comercial: '+d.sales_goal:''}`).join('\n')}${sales}\n\nREGLAS DE NEGOCIO:\n${p.rules.map(r=>'- '+r).join('\n')}`}
async function runProductTool(args){const q=String(args?.query||'').trim();const price=Number(args?.precio_aproximado||0)||'';const url='/api/hostelecan-products?q='+encodeURIComponent(q)+(price?'&price='+encodeURIComponent(price):'');const r=await fetch(url,{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudo consultar el catálogo');return data}
async function handleToolCall(ev){if(ev.name!=='buscar_producto_hostelecan')return;let args={};try{args=JSON.parse(ev.arguments||'{}')}catch{}statusEl.textContent='Consultando catálogo de Hostelecan…';let output;try{output=await runProductTool(args)}catch(e){output={error:e.message||String(e)}}if(dc?.readyState!=='open')return;dc.send(JSON.stringify({type:'conversation.item.create',item:{type:'function_call_output',call_id:ev.call_id,output:JSON.stringify(output)}}));dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:'Responde como una persona del equipo y también como buen comercial si hay intención de compra. No menciones herramientas ni bases de datos. Usa solo datos reales del resultado. Si hay una coincidencia claramente adecuada, da primero esa opción y explica brevemente por qué puede encajar. No leas listas largas. Si merece la pena, ofrece una sola alternativa útil. Si el cliente ya eligió modelo, facilita la compra y no le vuelvas a abrir cinco opciones. in_stock=true significa disponibilidad para compra online, no una unidad física confirmada. Si no hay plazo específico, la entrega habitual de Hostelecan es de 24 a 72 horas. No repitas información ya dada ni datos que el cliente ya haya proporcionado.'}}));statusEl.textContent='Nexo Voice está escuchando'}
function setMic(on){localStream?.getAudioTracks().forEach(t=>t.enabled=on)}
function unlockAfterGreeting(){if(!initialGreeting)return;initialGreeting=false;if(greetingTimer){clearTimeout(greetingTimer);greetingTimer=null}setMic(true);statusEl.textContent='Nexo Voice está escuchando'}
function cleanup(){if(greetingTimer){clearTimeout(greetingTimer);greetingTimer=null}try{dc?.close()}catch{}try{pc?.close()}catch{}localStream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{}pc=dc=localStream=null;greetingSent=false;initialGreeting=true;startBtn.disabled=false;stopBtn.disabled=true;statusEl.textContent='Listo para probar'}
function sendGreeting(p){if(greetingSent||dc?.readyState!=='open')return;greetingSent=true;statusEl.textContent='Nexo Voice se está presentando…';dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:`Haz una única presentación breve y natural. Di exactamente: "Hola, soy Nexo Voice, el asistente virtual de Hostelecan. ¿En qué puedo ayudarte?". Al pronunciar Hostelecan, articula os-te-le-can, cuatro sílabas claras; no digas Ustedecán ni Hostelcan. Después habla siempre como parte del equipo de Hostelecan y no vuelvas a presentarte salvo que el cliente te pregunte quién eres.`}}));greetingTimer=setTimeout(unlockAfterGreeting,5000)}
startBtn.onclick=async()=>{startBtn.disabled=true;errorEl.style.display='none';statusEl.textContent='Conectando…';try{const p=await loadProfile();localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});setMic(false);pc=new RTCPeerConnection();pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{stopBtn.disabled=false;statusEl.textContent='Preparando Nexo Voice…';dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:build(p),audio:{output:{voice:'cedar'}},tools:[PRODUCT_TOOL],tool_choice:'auto'}}))};dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='session.updated')sendGreeting(p);if(x.type==='response.function_call_arguments.done')handleToolCall(x);if(x.type==='response.done'&&initialGreeting)unlockAfterGreeting();if(x.type==='error'){errorEl.style.display='block';errorEl.textContent=JSON.stringify(x.error||x);if(initialGreeting)unlockAfterGreeting()}}catch{}};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))cleanup()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});const body=await r.text();if(!r.ok)throw new Error(body);await pc.setRemoteDescription({type:'answer',sdp:body})}catch(e){cleanup();errorEl.style.display='block';errorEl.textContent=e.message||String(e)}};stopBtn.onclick=cleanup;window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);
</script></body></html>
