<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Voice · Conversación finalistas</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--gold:#e7c980}*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;padding:20px}.wrap{max-width:760px;margin:auto}.card{background:#0d0d0d;border:1px solid #d6ab5c55;border-radius:24px;padding:24px}h1{margin:8px 0;font-size:clamp(30px,7vw,48px)}p{color:#aaa;line-height:1.5}.voices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.voice{padding:16px;border:1px solid #ffffff20;background:#151515;border-radius:16px;cursor:pointer;color:#fff;text-align:left}.voice.active{border-color:var(--gold);background:#d6ab5c18}.voice b{font-size:19px}.voice small{display:block;color:#999;margin-top:5px}.talk{width:100%;padding:17px;border:0;border-radius:15px;background:var(--gold);color:#111;font-size:18px;font-weight:900}.talk.listening{background:#fff}.status{padding:14px;margin:14px 0;background:#ffffff0a;border-radius:13px}.chat{margin-top:18px;display:grid;gap:9px}.msg{padding:12px 14px;border-radius:14px;line-height:1.4}.me{background:#ffffff10}.ai{background:#d6ab5c18;border:1px solid #d6ab5c33}audio{width:100%;margin-top:15px}@media(max-width:600px){.voices{grid-template-columns:1fr}}</style></head><body><div class="wrap"><main class="card"><div style="color:var(--gold);font-size:12px;letter-spacing:.14em">NEXO VOICE · PRUEBA CONVERSACIONAL</div><h1>Habla con las 4 finalistas.</h1><p>Elige Bella, Charlie, Siena o Alejandra. Pulsa el botón, habla y la voz elegida te responderá. Puedes cambiar de voz cuando quieras manteniendo la conversación.</p><div id="voices" class="voices"></div><div id="status" class="status">Cargando las cuatro voces…</div><button id="talk" class="talk" disabled>🎙️ Hablar</button><audio id="player" controls></audio><div id="chat" class="chat"></div></main></div><script>
const wanted=['bella','charlie','siena','alejandra'];let voices=[],selected=null,history=[];const vbox=document.getElementById('voices'),status=document.getElementById('status'),talk=document.getElementById('talk'),player=document.getElementById('player'),chat=document.getElementById('chat');
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function renderVoices(){vbox.innerHTML=voices.map(v=>`<button class="voice ${selected?.voice_id===v.voice_id?'active':''}" data-id="${v.voice_id}"><b>${esc(v.name)}</b><small>Conversación Nexo Voice</small></button>`).join('');vbox.querySelectorAll('.voice').forEach(b=>b.onclick=()=>{selected=voices.find(v=>v.voice_id===b.dataset.id);renderVoices();talk.disabled=false;status.textContent='Seleccionada: '+selected.name+'. Pulsa Hablar.'})}
function add(role,text){history.push({role,text});const d=document.createElement('div');d.className='msg '+(role==='user'?'me':'ai');d.innerHTML='<b>'+(role==='user'?'Tú':esc(selected?.name||'Nexo Voice'))+':</b> '+esc(text);chat.prepend(d)}
async function speak(text){status.textContent=selected.name+' está respondiendo…';const r=await fetch('/api/elevenlabs-tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice_id:selected.voice_id,text})});if(!r.ok)throw new Error('No se pudo generar la voz');const blob=await r.blob();player.src=URL.createObjectURL(blob);await player.play();status.textContent='Puedes seguir hablando con '+selected.name+'.'}
function answer(t){const x=t.toLowerCase();if(/hola|buenas|buenos/.test(x))return 'Hola, encantada de atenderte. Cuéntame con tranquilidad, ¿en qué puedo ayudarte?';if(/factura|presupuesto/.test(x))return 'Claro. Dime de qué empresa o documento se trata y te ayudo a localizar la información necesaria.';if(/horario|abierto|cerrado/.test(x))return 'Puedo consultar el horario de la empresa y darte la información al momento. ¿Qué día necesitas comprobar?';if(/cita|reserva/.test(x))return 'Por supuesto. Puedo ayudarte a gestionar una cita o reserva. Dime qué día te vendría mejor.';if(/precio|cu[aá]nto/.test(x))return 'Puedo recoger lo que necesitas y hacer que el equipo comercial prepare una propuesta adaptada a tu empresa.';return 'Entendido. Para ayudarte bien, cuéntame un poco más sobre lo que necesitas y seguimos desde ahí.'}
let rec=null;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.lang='es-ES';rec.interimResults=false;rec.onstart=()=>{talk.classList.add('listening');talk.textContent='🔴 Escuchando…';status.textContent='Habla ahora.'};rec.onend=()=>{talk.classList.remove('listening');talk.textContent='🎙️ Hablar'};rec.onerror=e=>status.textContent='No he podido oírte. Prueba otra vez.';rec.onresult=async e=>{const text=e.results[0][0].transcript;add('user',text);const reply=answer(text);add('assistant',reply);try{await speak(reply)}catch(e){status.textContent=e.message}};talk.onclick=()=>rec.start()}else{talk.textContent='El navegador no admite conversación por micrófono';status.textContent='Abre esta prueba en Chrome para usar el micrófono.'}
(async()=>{try{const r=await fetch('/api/elevenlabs-voices',{cache:'no-store'}),d=await r.json();const all=d.voices||[];voices=wanted.map(w=>all.find(v=>String(v.name||'').toLowerCase().startsWith(w))).filter(Boolean);selected=voices.find(v=>v.name.toLowerCase().startsWith('alejandra'))||voices[0];renderVoices();talk.disabled=!selected;status.textContent=selected?'He dejado Alejandra seleccionada para empezar. Pulsa Hablar.':'No se han encontrado las finalistas.'}catch(e){status.textContent='No se pudieron cargar las voces.'}})();
</script></body></html>
