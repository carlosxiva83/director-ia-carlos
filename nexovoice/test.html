<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nexo Voice" />
  <title>Nexo Voice · Pruebas</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e293b 0,#0f172a 45%,#020617 100%);color:#fff;display:grid;place-items:center;padding:22px}
    .card{width:min(560px,100%);background:rgba(15,23,42,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px;box-shadow:0 28px 80px rgba(0,0,0,.35)}
    .brand{font-size:14px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
    h1{font-size:34px;line-height:1.05;margin:10px 0 10px}.sub{opacity:.74;line-height:1.5;margin:0 0 24px}
    .status{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.06);border-radius:16px;padding:14px 16px;margin-bottom:20px}
    .dot{width:11px;height:11px;border-radius:999px;background:#64748b;box-shadow:0 0 0 6px rgba(100,116,139,.12)}
    .dot.live{background:#22c55e;box-shadow:0 0 0 6px rgba(34,197,94,.14)}
    button{width:100%;border:0;border-radius:18px;padding:17px 18px;font-size:17px;font-weight:700;cursor:pointer}
    #start{background:#fff;color:#0f172a}#stop{margin-top:10px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
    button:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:13px;opacity:.55;text-align:center;margin:17px 0 0}
    #error{display:none;margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);font-size:13px;line-height:1.4;word-break:break-word}
    audio{width:100%;margin-top:14px;display:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Nexo Voice</div>
    <h1>Prueba de voz</h1>
    <p class="sub">Habla con Nexo Voice desde el móvil u ordenador sin hacer una llamada internacional.</p>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Listo para probar</span></div>
    <button id="start">🎙️ Empezar conversación</button>
    <button id="stop" disabled>Finalizar prueba</button>
    <div id="error"></div>
    <audio id="remote" autoplay></audio>
    <p class="hint">La primera vez, permite el acceso al micrófono. Esta pantalla se actualizará automáticamente con las nuevas versiones.</p>
  </main>
<script>
let pc, dc, localStream;
const startBtn=document.getElementById('start');
const stopBtn=document.getElementById('stop');
const statusEl=document.getElementById('status');
const dot=document.getElementById('dot');
const remote=document.getElementById('remote');
const errorEl=document.getElementById('error');
const VOICE_STYLE=`Habla siempre en español de España. Eres la persona de confianza que atiende el teléfono de la empresa, no una centralita. Tu trato debe ser muy cercano, humano, simpático y resolutivo, manteniendo profesionalidad. Habla como una compañera real de la empresa: escucha primero, responde a lo que te cuentan y haz una sola pregunta cada vez. Usa expresiones naturales cuando encajen, como “vale, cuéntame”, “sí, claro”, “perfecto”, “dime”, “a ver, cuéntame” o “vale, te ayudo con eso”. No repitas siempre las mismas expresiones ni metas muletillas en cada frase. Evita por completo lenguaje de centralita o burocrático como “procederé”, “su solicitud”, “indique el motivo” o respuestas excesivamente formales. No hagas interrogatorios ni recites formularios: consigue los datos dentro de una conversación normal. Si la persona habla de manera cercana, sé más cercana; si habla formalmente, adapta el tono. Usa frases cortas, ritmo natural, entonación variable y pausas breves. No digas que has ejecutado, transferido o registrado una acción si no está realmente conectada. La marca se escribe Aurenexo, pero al pronunciarla debes decir claramente “Aura Nexo”, en dos palabras, nunca “Aure Nexo”.`;
function setStatus(text,live=false){statusEl.textContent=text;dot.classList.toggle('live',live)}
function showError(text){errorEl.style.display='block';errorEl.textContent=text}
function clearError(){errorEl.style.display='none';errorEl.textContent=''}
function cleanup(){try{dc?.close()}catch{};try{pc?.close()}catch{};localStream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{};pc=null;dc=null;localStream=null;startBtn.disabled=false;stopBtn.disabled=true;setStatus('Listo para probar')}
startBtn.addEventListener('click',async()=>{
  startBtn.disabled=true;clearError();setStatus('Conectando…');
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true});
    pc=new RTCPeerConnection();
    pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};
    localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));
    dc=pc.createDataChannel('oai-events');
    dc.onopen=()=>{
      setStatus('Nexo Voice está escuchando',true);stopBtn.disabled=false;
      dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:VOICE_STYLE,audio:{output:{voice:'marin'}}}}));
      setTimeout(()=>{
        if(dc?.readyState==='open'){
          dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:"Saluda de forma breve, cercana y muy natural, como una persona real que acaba de coger el teléfono. Di exactamente: 'Hola, soy Nexo Voice, el asistente personal de Aura Nexo. ¿En qué puedo ayudarte?'. Pronuncia Aura Nexo en dos palabras, con 'Aura' completo. Después conversa con mucha cercanía y haz solo una pregunta cada vez."}}));
        }
      },150);
    };
    dc.onmessage=e=>{try{const ev=JSON.parse(e.data);if(ev.type==='error'){console.error(ev);setStatus('Error de OpenAI');showError(JSON.stringify(ev.error||ev))}}catch{}};
    pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState)){cleanup();}}
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);
    const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});
    const body=await r.text();
    if(!r.ok) throw new Error('Servidor '+r.status+': '+body);
    await pc.setRemoteDescription({type:'answer',sdp:body});
  }catch(err){console.error(err);cleanup();setStatus('No se pudo conectar');showError(err?.message||String(err));alert('La prueba no ha conectado. Ahora verás debajo el error real para poder corregirlo.');}
});
stopBtn.addEventListener('click',cleanup);
window.addEventListener('pagehide',cleanup);
window.addEventListener('beforeunload',cleanup);
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
</script>
</body>
</html>
