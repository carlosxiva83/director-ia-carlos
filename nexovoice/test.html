<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Nexo Voice · Pruebas</title><meta name="description" content="Prueba de voz de Nexo Voice."><meta property="og:type" content="website"><meta property="og:site_name" content="Nexo Voice"><meta property="og:title" content="Nexo Voice · Prueba de voz"><meta property="og:description" content="Habla con Nexo Voice."><meta property="og:url" content="https://nexovoice.es/test.html"><meta property="og:image" content="https://nexovoice.es/social-preview.png?v=4"><meta property="og:image:secure_url" content="https://nexovoice.es/social-preview.png?v=4"><meta property="og:image:type" content="image/png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://nexovoice.es/social-preview.png?v=4"><link rel="icon" href="/app-icon.svg?v=4" type="image/svg+xml"><link rel="apple-touch-icon" href="/app-icon.svg?v=4"><link rel="manifest" href="/manifest.json?v=4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nexo Voice"><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e293b,#0f172a 45%,#020617);color:#fff;display:grid;place-items:center;padding:22px}.card{width:min(560px,100%);background:rgba(15,23,42,.82);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px}.brand{font-size:14px;letter-spacing:.16em;opacity:.7}h1{font-size:34px;margin:10px 0}.sub{opacity:.74;line-height:1.5}.status{background:rgba(255,255,255,.06);border-radius:16px;padding:14px 16px;margin:20px 0}button{width:100%;border:0;border-radius:18px;padding:17px;font-size:17px;font-weight:700}#start{background:#fff;color:#0f172a}#stop{margin-top:10px;background:rgba(255,255,255,.08);color:#fff}button:disabled{opacity:.45}#error{display:none;margin-top:14px;padding:12px;background:rgba(239,68,68,.12);border-radius:14px}audio{display:none}</style></head><body><main class="card"><div class="brand">NEXO VOICE · C4.2</div><h1>Prueba de voz</h1><p class="sub">Base general de Nexo Voice · voz, rapidez y ruido afinados.</p><div class="status" id="status">Listo para probar</div><button id="start">🎙️ Empezar conversación</button><button id="stop" disabled>Finalizar prueba</button><div id="error"></div><audio id="remote" autoplay></audio></main><script>
let pc,dc,localStream;let greetingSent=false,initialGreeting=true,greetingTimer=null;const startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop'),statusEl=document.getElementById('status'),remote=document.getElementById('remote'),errorEl=document.getElementById('error');
const VOICE_STYLE=`Habla siempre en español de España. Atiendes el teléfono como una persona real de la empresa, no como una centralita. Sé cercana, tranquila, resolutiva y profesional. VOZ HUMANA: no suenes a locución, anuncio, tutorial ni asistente virtual que recita. Habla como en una llamada real: ritmo conversacional, frases normalmente cortas, pequeñas variaciones naturales de longitud y entonación, sin sobreactuar simpatía. Evita una cadencia demasiado perfecta o ceremoniosa. Cuando baste una respuesta de pocas palabras, úsala. Puedes usar expresiones naturales como “sí”, “dime”, “un momento”, “eso sí” o “te lo miro” solo cuando encajen, sin convertirlas en muletillas. No rellenes silencios con frases innecesarias. RESPUESTA ÁGIL: empieza a contestar en cuanto hayas entendido que la persona ha terminado; no añadas introducciones antes de la respuesta. Ve primero al dato o solución que te han pedido. Si necesitas consultar algo, una frase breve como “Sí, te lo miro” es suficiente antes de la consulta; no inventes que ya la has hecho. RUIDO Y OTRAS VOCES: céntrate en la persona que está hablando contigo cerca del micrófono. Ignora ruidos ambientales, golpes, televisión, conversaciones lejanas, niños u otras voces de fondo si no están claramente dirigiéndose a ti. No interrumpas tu respuesta ni cambies de turno por un sonido aislado o una voz lejana. Si el interlocutor principal te corta de forma clara para corregirte, añadir algo o decir “espera”, “no” o similar, deja de hablar y escúchalo con normalidad. Si un audio es dudoso o ininteligible, no inventes lo que se dijo. Recuerda activamente toda la información que la persona haya dado durante la conversación y nunca vuelvas a pedir un dato ya proporcionado, aunque lo dijera antes de que lo preguntaras o junto con otros datos. Si da varios datos de golpe, intégralos todos y pregunta solo por lo que falte. No repitas ni resumas lo que acaba de decir salvo que necesites aclarar algo. No respondas automáticamente “perfecto”, “vale”, “claro”, “entiendo” o “de acuerdo” después de cada dato. No anuncies procesos ni digas “voy a tomar unos datos”, “quiero pedirte unos datos”, “para poder ayudarte necesito” o similares. Cuando necesites datos básicos compatibles, pídelos juntos de forma natural, por ejemplo “Dime tu nombre y un teléfono de contacto”; si ya conoces uno, pide solo el que falta. Los detalles que requieren explicación se preguntan después dentro de la conversación. No sigas un formulario rígido ni corrijas el orden en que llega la información. Alterna respuestas muy breves con otras más completas cuando sea necesario. No conviertas cada turno en respuesta+explicación+pregunta. Usa lenguaje oral, directo y variado. No inventes acciones realizadas. Preséntate solo una vez al inicio de la conversación. Después, aunque la persona diga hola, no vuelvas a presentarte ni encadenes saludos repetidos. La marca Aurenexo se pronuncia “Aura Nexo”.`;
function setMic(on){localStream?.getAudioTracks().forEach(t=>t.enabled=on)}
function unlockAfterGreeting(){if(!initialGreeting)return;initialGreeting=false;if(greetingTimer){clearTimeout(greetingTimer);greetingTimer=null}setMic(true);statusEl.textContent='Nexo Voice está escuchando'}
function cleanup(){if(greetingTimer){clearTimeout(greetingTimer);greetingTimer=null}try{dc?.close()}catch{}try{pc?.close()}catch{}localStream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{}pc=dc=localStream=null;greetingSent=false;initialGreeting=true;startBtn.disabled=false;stopBtn.disabled=true;statusEl.textContent='Listo para probar'}
function sendGreeting(){if(greetingSent||dc?.readyState!=='open')return;greetingSent=true;statusEl.textContent='Nexo Voice se está presentando…';dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:"Haz una única presentación breve y natural, con tono de llamada real y sin voz de locución: 'Hola, soy Nexo Voice, de Aura Nexo. Dime, ¿en qué te puedo ayudar?'. Dila una sola vez y no repitas el saludo."}}));greetingTimer=setTimeout(unlockAfterGreeting,5000)}
startBtn.onclick=async()=>{startBtn.disabled=true;errorEl.style.display='none';statusEl.textContent='Conectando…';try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});setMic(false);pc=new RTCPeerConnection();pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{stopBtn.disabled=false;statusEl.textContent='Preparando Nexo Voice…';dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:VOICE_STYLE,audio:{input:{noise_reduction:{type:'near_field'},turn_detection:{type:'server_vad',threshold:0.67,prefix_padding_ms:250,silence_duration_ms:380,create_response:true,interrupt_response:true}},output:{voice:'cedar'}}}}))};dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='session.updated')sendGreeting();if(x.type==='response.done'&&initialGreeting)unlockAfterGreeting();if(x.type==='error'){errorEl.style.display='block';errorEl.textContent=JSON.stringify(x.error||x);if(initialGreeting)unlockAfterGreeting()}}catch{}};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))cleanup()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});const body=await r.text();if(!r.ok)throw new Error(body);await pc.setRemoteDescription({type:'answer',sdp:body})}catch(e){cleanup();errorEl.style.display='block';errorEl.textContent=e.message||String(e)}};stopBtn.onclick=cleanup;window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);
</script></body></html>
