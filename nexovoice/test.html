<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nexo Voice · Pruebas</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e293b,#0f172a 45%,#020617);color:#fff;display:grid;place-items:center;padding:22px}.card{width:min(560px,100%);background:rgba(15,23,42,.82);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px}.brand{font-size:14px;letter-spacing:.16em;opacity:.7}h1{font-size:34px;margin:10px 0}.sub{opacity:.74;line-height:1.5}.status{background:rgba(255,255,255,.06);border-radius:16px;padding:14px 16px;margin:20px 0}button{width:100%;border:0;border-radius:18px;padding:17px;font-size:17px;font-weight:700}#start{background:#fff;color:#0f172a}#stop{margin-top:10px;background:rgba(255,255,255,.08);color:#fff}button:disabled{opacity:.45}#error{display:none;margin-top:14px;padding:12px;background:rgba(239,68,68,.12);border-radius:14px}audio{display:none}</style></head><body><main class="card"><div class="brand">NEXO VOICE · C4.1</div><h1>Prueba de voz</h1><p class="sub">Base general de Nexo Voice.</p><div class="status" id="status">Listo para probar</div><button id="start">🎙️ Empezar conversación</button><button id="stop" disabled>Finalizar prueba</button><div id="error"></div><audio id="remote" autoplay></audio></main><script>
let pc,dc,localStream;let greetingSent=false,initialGreeting=true,greetingTimer=null;const startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop'),statusEl=document.getElementById('status'),remote=document.getElementById('remote'),errorEl=document.getElementById('error');
const VOICE_STYLE=`Habla siempre en español de España. Atiendes el teléfono como una persona real de la empresa, no como una centralita. Sé cercana, tranquila, resolutiva y profesional. Recuerda activamente toda la información que la persona haya dado durante la conversación y nunca vuelvas a pedir un dato ya proporcionado, aunque lo dijera antes de que lo preguntaras o junto con otros datos. Si da varios datos de golpe, intégralos todos y pregunta solo por lo que falte. No repitas ni resumas lo que acaba de decir salvo que necesites aclarar algo. No respondas automáticamente “perfecto”, “vale”, “claro”, “entiendo” o “de acuerdo” después de cada dato. No anuncies procesos ni digas “voy a tomar unos datos”, “quiero pedirte unos datos”, “para poder ayudarte necesito” o similares. Cuando necesites datos básicos compatibles, pídelos juntos de forma natural, por ejemplo “Dime tu nombre y un teléfono de contacto”; si ya conoces uno, pide solo el que falta. Los detalles que requieren explicación se preguntan después dentro de la conversación. No sigas un formulario rígido ni corrijas el orden en que llega la información. Alterna respuestas muy breves con otras más completas cuando sea necesario. No conviertas cada turno en respuesta+explicación+pregunta. Usa lenguaje oral, directo y variado. No inventes acciones realizadas. Preséntate solo una vez al inicio de la conversación. Después, aunque la persona diga hola, no vuelvas a presentarte ni encadenes saludos repetidos. La marca Aurenexo se pronuncia “Aura Nexo”.`;
function setMic(on){localStream?.getAudioTracks().forEach(t=>t.enabled=on)}
function unlockAfterGreeting(){if(!initialGreeting)return;initialGreeting=false;if(greetingTimer){clearTimeout(greetingTimer);greetingTimer=null}setMic(true);statusEl.textContent='Nexo Voice está escuchando'}
function cleanup(){if(greetingTimer){clearTimeout(greetingTimer);greetingTimer=null}try{dc?.close()}catch{}try{pc?.close()}catch{}localStream?.getTracks().forEach(t=>t.stop());try{remote.pause();remote.srcObject=null}catch{}pc=dc=localStream=null;greetingSent=false;initialGreeting=true;startBtn.disabled=false;stopBtn.disabled=true;statusEl.textContent='Listo para probar'}
function sendGreeting(){if(greetingSent||dc?.readyState!=='open')return;greetingSent=true;statusEl.textContent='Nexo Voice se está presentando…';dc.send(JSON.stringify({type:'response.create',response:{output_modalities:['audio'],instructions:"Haz una única presentación breve y natural: 'Hola, soy Nexo Voice, de Aura Nexo. Dime, ¿en qué te puedo ayudar?'. Dila una sola vez y no repitas el saludo."}}));greetingTimer=setTimeout(unlockAfterGreeting,5000)}
startBtn.onclick=async()=>{startBtn.disabled=true;errorEl.style.display='none';statusEl.textContent='Conectando…';try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});setMic(false);pc=new RTCPeerConnection();pc.ontrack=e=>{remote.srcObject=e.streams[0];remote.play().catch(()=>{})};localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{stopBtn.disabled=false;statusEl.textContent='Preparando Nexo Voice…';dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:VOICE_STYLE,audio:{output:{voice:'cedar'}}}}))};dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='session.updated')sendGreeting();if(x.type==='response.done'&&initialGreeting)unlockAfterGreeting();if(x.type==='error'){errorEl.style.display='block';errorEl.textContent=JSON.stringify(x.error||x);if(initialGreeting)unlockAfterGreeting()}}catch{}};pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState))cleanup()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/test-call',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});const body=await r.text();if(!r.ok)throw new Error(body);await pc.setRemoteDescription({type:'answer',sdp:body})}catch(e){cleanup();errorEl.style.display='block';errorEl.textContent=e.message||String(e)}};stopBtn.onclick=cleanup;window.addEventListener('pagehide',cleanup);window.addEventListener('beforeunload',cleanup);
</script></body></html>
